<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네이처과학학원 완벽내신 CHECKLIST</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
        
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: 'Pretendard', 'Malgun Gothic', sans-serif; background-color: #f0f2f5; color: #222222; margin: 0; padding: 40px 20px 140px 20px; display: flex; flex-direction: column; align-items: center; }

        /* [학년 선택 마스터 컨트롤 세그먼트] */
        .grade-tab-container { display: flex; width: 100%; max-width: 860px; background: #111c3a; border-radius: 8px 8px 0 0; padding: 10px 15px; gap: 10px; }
        .tab-btn { flex: 1; padding: 12px; background: rgba(255, 255, 255, 0.1); color: rgba(255, 255, 255, 0.7); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 6px; font-size: 14px; font-weight: 800; cursor: pointer; transition: all 0.2s ease; }
        .tab-btn:hover { background: rgba(255, 255, 255, 0.2); color: #ffffff; }
        .tab-btn.active { background: #d4af37; color: #111c3a; border-color: #d4af37; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }

        /* [선생님 전용 범위 설정 패널] */
        .scope-selector-panel { width: 100%; max-width: 860px; background-color: #ffffff; border: 2px solid #111c3a; border-top: none; border-radius: 0 0 8px 8px; padding: 22px; margin-bottom: 25px; box-shadow: 0 6px 15px rgba(0,0,0,0.05); }
        .selector-title { font-size: 15px; font-weight: 800; color: #111c3a; margin-bottom: 14px; }
        .master-control-row { display: flex; gap: 8px; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid #e2e8f0; align-items: center; }
        .btn-master { padding: 6px 14px; font-size: 12px; font-weight: 800; border-radius: 4px; cursor: pointer; transition: all 0.15s ease; }
        .btn-master-all { background-color: #111c3a; color: #ffffff; border: 1px solid #111c3a; }
        .btn-master-clear { background-color: #ffffff; color: #111c3a; border: 1px solid #cbd5e1; }
        .btn-master-reset { background-color: #b23a48; color: #ffffff; border: 1px solid #b23a48; margin-left: auto; }
        .btn-master-reset:hover { background-color: #922a36; }
        
        .scope-group-container { display: flex; flex-direction: column; gap: 10px; }
        .scope-group { border: 1px solid #e2e8f0; border-radius: 6px; padding: 12px 16px; background: #f8fafc; }
        .group-header-label { font-size: 14px; font-weight: 800; color: #111c3a; display: flex; align-items: center; gap: 6px; margin-bottom: 10px; cursor: pointer; }
        .group-header-label input { width: 16px; height: 16px; accent-color: #111c3a; }
        .sub-group-grid { display: flex; flex-wrap: wrap; gap: 8px; padding-left: 22px; border-top: 1px dashed #e2e8f0; padding-top: 10px; }
        .sub-scope-label { font-size: 12.5px; font-weight: 600; color: #475569; display: flex; align-items: center; gap: 6px; cursor: pointer; background: #ffffff; padding: 5px 12px; border: 1px solid #cbd5e1; border-radius: 4px; }
        .sub-scope-label input { width: 14px; height: 14px; accent-color: #d4af37; }

        /* [A4 프리미엄 대지 디자인] */
        .report-paper { width: 210mm; min-height: 297mm; background-color: #ffffff; padding: 25mm 20mm; box-shadow: 0 10px 40px rgba(0,0,0,0.08); position: relative; box-sizing: border-box; border: 1px solid #111c3a; }
        .report-paper::before { content: ''; position: absolute; top: 12px; left: 12px; right: 12px; bottom: 12px; border: 2px solid #111c3a; pointer-events: none; }
        .report-paper::after { content: ''; position: absolute; top: 18px; left: 18px; right: 18px; bottom: 18px; border: 1px solid #d4af37; pointer-events: none; }

        /* [헤더 섹션] */
        .header-section { background-color: #111c3a; border-bottom: 4px solid #d4af37; padding: 22px 28px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; color: #ffffff; position: relative; z-index: 5; }
        .logo-area { font-size: 12px; font-weight: 800; color: #d4af37; letter-spacing: 2px; margin-bottom: 4px; }
        .main-title { font-size: 25px; font-weight: 900; margin: 0; letter-spacing: -0.5px; }
        
        .student-meta-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: rgba(255, 255, 255, 0.08); padding: 10px 14px; border-radius: 6px; border: 1px solid rgba(214, 175, 55, 0.3); }
        .meta-cell { display: flex; align-items: center; gap: 6px; }
        .meta-cell label { font-size: 12px; font-weight: 700; color: #d4af37; white-space: nowrap; }
        .meta-input { background: transparent; border: none; border-bottom: 1px solid #d4af37; color: #ffffff; font-size: 14px; font-weight: 800; width: 85px; text-align: center; outline: none; }
        .meta-select { background: #111c3a; border: none; border-bottom: 1px solid #d4af37; color: #ffffff; font-size: 12.5px; font-weight: 800; outline: none; cursor: pointer; width: 105px; }

        /* [테이블 구조] */
        .unit-block { margin-bottom: 28px; page-break-inside: avoid; display: block; }
        .table-title { font-size: 13.5px; font-weight: 800; color: #ffffff; padding: 8px 16px; border-radius: 5px 5px 0 0; display: inline-block; background-color: #111c3a; }
        .checklist-table { width: 100%; border-collapse: collapse; margin-top: -1px; }
        .checklist-table th, .checklist-table td { border: 1px solid #bbbbbb; padding: 10px 8px; font-size: 13px; line-height: 1.5; }
        .checklist-table th { background-color: #f4f6f9; color: #111c3a; font-weight: 800; text-align: center; }
        
        .editable-tag { font-size: 11px; font-weight: 600; color: #d4af37; background-color: #111c3a; padding: 2px 6px; border-radius: 3px; margin-left: 4px; vertical-align: middle; }

        .content-td, .solution-td { outline: none; transition: background 0.15s ease; cursor: pointer; }
        .content-td:focus, .solution-td:focus { background-color: #ffffdd !important; }
        .content-list { margin: 0; padding-left: 15px; color: #444444; }
        .content-list li { margin-bottom: 4px; }

        .grade-td { text-align: center; width: 110px; }
        .btn-group { display: flex; gap: 4px; justify-content: center; }
        .btn-grade { border: 1px solid #dddddd; background-color: #ffffff; padding: 4px 8px; font-size: 11px; font-weight: 800; border-radius: 4px; cursor: pointer; }
        .btn-grade.active-a { background-color: #e8f5e9 !important; color: #2e7d32 !important; border-color: #2e7d32 !important; }
        .btn-grade.active-b { background-color: #fff3e0 !important; color: #e65100 !important; border-color: #e65100 !important; }
        .btn-grade.active-c { background-color: #ffebee !important; color: #c62828 !important; border-color: #c62828 !important; }
        
        .print-only-badge { display: none; font-weight: 900; padding: 4px 10px; border-radius: 4px; font-size: 13px; }
        .solution-td { font-size: 12px; font-weight: 600; text-align: center; color: #555555; width: 170px; background-color: #fafafa; }
        .sol-c { color: #c62828; font-weight: 700; }

        /* 매크로 팝오버 창 */
        #solution-macro-popover { position: absolute; display: none; background: #ffffff; border: 2px solid #111c3a; box-shadow: 0 6px 20px rgba(0,0,0,0.15); border-radius: 6px; padding: 8px; z-index: 10005; width: 220px; flex-direction: column; gap: 4px; }
        .macro-btn { background: #f8fafc; border: 1px solid #cbd5e1; color: #334155; padding: 6px 10px; font-size: 11.5px; font-weight: 700; border-radius: 4px; text-align: left; cursor: pointer; transition: all 0.1s ease; }
        .macro-btn:hover { background: #111c3a; color: #ffffff; border-color: #111c3a; }

        /* [종합 피드백 블록] */
        .opinion-section { margin-top: 30px; page-break-inside: avoid; }
        .opinion-title { font-size: 15px; font-weight: 800; color: #111c3a; margin-bottom: 8px; border-left: 4px solid #111c3a; padding-left: 8px; }
        .chip-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .opinion-chip { background-color: #ffffff; border: 1px solid #111c3a; color: #111c3a; padding: 6px 12px; font-size: 12px; font-weight: 600; border-radius: 20px; cursor: pointer; }
        .opinion-chip:hover { background-color: #111c3a; color: #ffffff; }
        .opinion-box { width: 100%; min-height: 110px; border: 1px solid #111c3a; padding: 15px; font-size: 13px; line-height: 1.6; color: #333333; outline: none; background-color: #fafafa; text-align: justify; }

        /* [하단 고정형 버튼 바] */
        .summary-bar { position: fixed; bottom: 0; left: 0; right: 0; background-color: #111c3a; padding: 15px 40px; display: flex; justify-content: center; align-items: center; gap: 15px; box-shadow: 0 -4px 20px rgba(0,0,0,0.15); z-index: 9999; border-top: 3px solid #d4af37; }
        .btn-action-print { background-color: #d4af37; color: #111c3a; border: none; padding: 12px 35px; font-size: 14px; font-weight: 800; border-radius: 4px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .btn-action-image { background-color: #2e7d32; color: #ffffff; border: none; padding: 12px 35px; font-size: 14px; font-weight: 800; border-radius: 4px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        /* [🖨️ 인쇄 최적화] */
        @media print {
            html, body { width: 210mm; height: 297mm; margin: 0 !important; padding: 0 !important; background-color: #ffffff; display: flex; justify-content: center; align-items: center; }
            .no-print { display: none !important; }
            .editable-tag { display: none !important; }
            .meta-select { -webkit-appearance: none !important; -moz-appearance: none !important; appearance: none !important; border: none !important; background: transparent !important; width: auto !important; }
            .meta-select::-ms-expand { display: none !important; }
            .meta-input { border: none !important; }
            .report-paper { box-shadow: none; border: none; width: 210mm; min-height: 297mm; padding: 20mm 18mm !important; margin: auto !important; display: block; position: relative; }
            .report-paper::before, .report-paper::after { display: block !important; }
            @page { size: A4; margin: 0; }
            
            .btn-group { display: none !important; }
            .print-only-badge { display: inline-block !important; }
            .content-td, .solution-td { background-color: transparent !important; }
            .opinion-box { background-color: transparent !important; border: 1px solid #111c3a !important; }
            .summary-bar { display: none !important; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <div class="grade-tab-container no-print">
        <button type="button" class="tab-btn active" id="tab-mid1" onclick="switchGrade('mid1')">중1 과학 리포트</button>
        <button type="button" class="tab-btn" id="tab-mid2" onclick="switchGrade('mid2')">중2 과학 리포트</button>
        <button type="button" class="tab-btn" id="tab-mid3" onclick="switchGrade('mid3')">중3 과학 리포트</button>
    </div>

    <div class="scope-selector-panel no-print">
        <div class="selector-title">🌿 단원 편집 마스터 컨트롤러</div>
        <div class="master-control-row">
            <button type="button" class="btn-master btn-master-all" onclick="setAllScopes(true)">✓ 전체 단원 켜기</button>
            <button type="button" class="btn-master btn-master-clear" onclick="setAllScopes(false)">✕ 전체 단원 끄기</button>
            <button type="button" class="btn-master btn-master-reset" onclick="resetCurrentReport()">🔄 새 학생 레포트 작성 (초기화)</button>
        </div>
        <div class="scope-group-container" id="scope-widget-root"></div>
    </div>

    <div class="report-paper" id="capture-target-paper">
        <div class="header-section">
            <div>
                <div class="logo-area">NATURE SCIENCE ACADEMY</div>
                <h1 class="main-title">완벽내신 CHECKLIST</h1>
            </div>
            <div class="student-meta-grid">
                <div class="meta-cell"><label>이름 :</label><input type="text" id="student-name" class="meta-input" value="네이처" oninput="syncFilenameAndSave()"></div>
                <div class="meta-cell"><label>학교명 :</label><input type="text" id="school-name" class="meta-input" value="네이처중" oninput="syncFilenameAndSave()"></div>
                <div class="meta-cell">
                    <label>시험 :</label>
                    <select id="exam-type" class="meta-select" onchange="syncFilenameAndSave()">
                        <option value="1학기 중간고사">1학기 중간 대비</option>
                        <option value="1학기 기말고사">1학기 기말 대비</option>
                        <option value="2학기 중간고사">2학기 중간 대비</option>
                        <option value="2학기 기말고사">2학기 기말 대비</option>
                        <option value="직전 파이널 모의고사">직전 파이널</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="report-table-root"></div>

        <div class="opinion-section">
            <div class="opinion-title">지도교사 종합 피드백 의견</div>
            <div class="chip-container no-print">
                <button class="opinion-chip" onclick="addText('개념 이해도는 전반적으로 우수하나 ')">개념 우수</button>
                <button class="opinion-chip" onclick="addText('핵심 용어 암기가 부족하여 오답이 다수 발생합니다. ')">암기 부족</button>
                <button class="opinion-chip" onclick="addText('기본 문항 대비 고난도 심화 유형 풀이에 취약점이 관찰됩니다. ')">고난도 부족</button>
                <button class="opinion-chip" onclick="addText('실전 모의고사 풀이 시 서술형 문항 감점을 최소화해야 합니다. ')">응용문제 부족</button>
                <button class="opinion-chip" onclick="addText('틀린 문항의 연계 이론 메커니즘을 완벽히 이해하고 재점검해야 합니다. ')">오답 보완 필요</button>
                <button class="opinion-chip" onclick="addText('추가로 배부된 기출 모의고사를 반드시 모두 풀고 검사받아야 합니다. ')">추가문제 풀이</button>
                <button class="opinion-chip
