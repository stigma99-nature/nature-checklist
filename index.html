<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>네이처과학학원 완벽내신 CHECKLIST</title>
    <style>
      @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");

      :root {
        --ink: #172033;
        --ink-soft: #40506a;
        --brand: #183153;
        --brand-2: #2f6f73;
        --gold: #d6a83d;
        --paper: #ffffff;
        --surface: #f7f9fc;
        --line: #d8e0eb;
        --danger: #b23a48;
        --shadow: 0 18px 45px rgba(23, 32, 51, 0.13);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        font-family: "Pretendard", "Malgun Gothic", sans-serif;
        background: linear-gradient(
          180deg,
          #eef4f6 0%,
          #f7f9fc 42%,
          #edf1f5 100%
        );
        color: var(--ink);
        margin: 0;
        padding: 18px 18px 28px;
      }
      button,
      input,
      select,
      [contenteditable="true"] {
        font: inherit;
      }
      button {
        min-height: 38px;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      [contenteditable="true"]:focus-visible {
        outline: 3px solid rgba(47, 111, 115, 0.26);
        outline-offset: 2px;
      }

      .app-shell {
        width: 100%;
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        gap: 18px;
        align-items: start;
      }
      .sidebar {
        position: sticky;
        top: 18px;
        max-height: calc(100vh - 36px);
        overflow: auto;
      }
      .report-workspace {
        min-width: 0;
        display: flex;
        justify-content: center;
        /* 우측 상단 고정 액션 독과 겹치지 않도록 상단 여백 확보 */
        padding-top: 96px;
      }

      /* [학년 선택 마스터 컨트롤 세그먼트] */
      .grade-tab-container {
        display: flex;
        flex-direction: column;
        width: 100%;
        background: var(--brand);
        border-radius: 8px 8px 0 0;
        padding: 10px;
        gap: 8px;
        box-shadow: var(--shadow);
      }
      .tab-btn {
        flex: 1;
        padding: 12px;
        background: rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
        transition:
          transform 0.16s ease,
          background 0.16s ease,
          color 0.16s ease;
      }
      .tab-btn:hover {
        background: rgba(255, 255, 255, 0.2);
        color: #ffffff;
      }
      .tab-btn.active {
        background: var(--gold);
        color: #111c3a;
        border-color: var(--gold);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.16);
        transform: translateY(-1px);
      }

      /* [선생님 전용 범위 설정 패널] */
      .scope-selector-panel {
        width: 100%;
        background-color: rgba(255, 255, 255, 0.96);
        border: 1px solid var(--line);
        border-top: none;
        border-radius: 0 0 8px 8px;
        padding: 14px;
        box-shadow: var(--shadow);
      }
      .selector-title {
        font-size: 15px;
        font-weight: 900;
        color: var(--brand);
        margin-bottom: 14px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      .status-pill {
        background: #e7f0f1;
        color: var(--brand-2);
        border: 1px solid #c4dddf;
        border-radius: 999px;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
      }
      .master-control-row {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 16px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--line);
        align-items: stretch;
      }
      .btn-master {
        padding: 8px 14px;
        font-size: 12px;
        font-weight: 800;
        border-radius: 6px;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease,
          background 0.15s ease;
      }
      .btn-master:hover,
      .btn-action-print:hover,
      .btn-action-image:hover,
      .opinion-chip:hover,
      .btn-grade:hover {
        transform: translateY(-1px);
      }
      .btn-master-all {
        background-color: var(--brand);
        color: #ffffff;
        border: 1px solid var(--brand);
      }
      .btn-master-clear {
        background-color: #ffffff;
        color: var(--brand);
        border: 1px solid #b8c5d6;
      }
      .btn-master-reset {
        background-color: var(--danger);
        color: #ffffff;
        border: 1px solid var(--danger);
      }
      .btn-master-reset:hover {
        background-color: #922a36;
      }

      .scope-group-container {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .scope-group {
        border: 1px solid var(--line);
        border-left: 5px solid var(--unit-color, var(--brand));
        border-radius: 8px;
        padding: 11px;
        background: var(--surface);
      }
      .group-header-label {
        font-size: 14px;
        font-weight: 900;
        color: var(--unit-color, var(--brand));
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        cursor: pointer;
      }
      .group-header-label input {
        width: 18px;
        height: 18px;
        accent-color: var(--unit-color, var(--brand-2));
      }
      .sub-group-grid {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding-left: 26px;
        border-top: 1px dashed var(--line);
        padding-top: 10px;
      }
      .sub-scope-label {
        font-size: 12.5px;
        font-weight: 700;
        color: var(--ink-soft);
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        background: #ffffff;
        padding: 7px 9px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        transition:
          border 0.15s ease,
          background 0.15s ease,
          color 0.15s ease;
      }
      .sub-scope-label:has(input:checked) {
        background: color-mix(
          in srgb,
          var(--unit-color, var(--brand-2)) 12%,
          #ffffff
        );
        border-color: color-mix(
          in srgb,
          var(--unit-color, var(--brand-2)) 55%,
          #ffffff
        );
        color: color-mix(
          in srgb,
          var(--unit-color, var(--brand-2)) 75%,
          #111c3a
        );
      }
      .sub-scope-label input {
        width: 15px;
        height: 15px;
        accent-color: var(--unit-color, var(--brand-2));
      }

      /* [A4 프리미엄 대지 디자인] */
      .report-paper {
        width: min(210mm, 100%);
        min-height: 297mm;
        background-color: var(--paper);
        padding: 23mm 18mm;
        box-shadow: var(--shadow);
        position: relative;
        box-sizing: border-box;
        border: 1px solid #c1cad8;
        overflow: hidden;
      }
      .report-paper::before {
        content: "";
        position: absolute;
        top: 12px;
        left: 12px;
        right: 12px;
        bottom: 12px;
        border: 2px solid var(--brand);
        pointer-events: none;
      }
      .report-paper::after {
        content: "";
        position: absolute;
        top: 18px;
        left: 18px;
        right: 18px;
        bottom: 18px;
        border: 1px solid var(--gold);
        pointer-events: none;
      }

      /* [헤더 섹션] */
      .header-section {
        background: linear-gradient(135deg, var(--brand), #214765);
        border-bottom: 4px solid var(--gold);
        padding: 22px 26px;
        margin-bottom: 28px;
        display: flex;
        flex-direction: column; /* 제목 아래에 학생정보가 오도록 세로 배치 */
        align-items: stretch;
        gap: 16px;
        color: #ffffff;
        position: relative;
        z-index: 5;
        border-radius: 6px;
      }
      .header-section > div:first-child {
        min-width: 0;
      }
      .logo-area {
        font-size: 12px;
        font-weight: 800;
        color: #f4d98a;
        letter-spacing: 1.4px;
        margin-bottom: 4px;
      }
      .main-title {
        font-size: 25px;
        font-weight: 900;
        margin: 0;
      }

      .student-meta-grid {
        display: grid;
        grid-template-columns:
          minmax(130px, 0.9fr)
          minmax(220px, 1.55fr)
          minmax(150px, 1.05fr);
        gap: 8px;
        background: transparent;
        padding: 10px 14px;
        border-radius: 6px;
        border: 1px solid rgba(214, 175, 55, 0.35);
        flex: 0 0 auto; /* 세로 스택에서 제목 아래 한 줄로 */
        min-width: 0;
      }
      .meta-cell {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .meta-cell label {
        font-size: 12px;
        font-weight: 800;
        color: #f4d98a;
        white-space: nowrap;
      }
      .meta-input {
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--gold);
        color: #ffffff;
        font-size: 14px;
        font-weight: 800;
        width: 100%;
        flex: 1 1 auto;
        min-width: 0;
        text-align: center;
        outline: none;
        padding: 5px 4px;
      }
      .meta-select {
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--gold);
        color: #ffffff;
        font-size: 12.5px;
        font-weight: 800;
        outline: none;
        cursor: pointer;
        width: 100%;
        flex: 1 1 auto;
        min-width: 0;
        padding: 5px 2px;
        text-align: center;
        text-align-last: center;
      }
      .meta-select option {
        color: #111c3a;
        background: #ffffff;
      }

      /* [테이블 구조] */
      .unit-block {
        margin-bottom: 28px;
        page-break-inside: avoid;
        display: block;
      }
      .table-title {
        font-size: 13.5px;
        font-weight: 900;
        color: #ffffff;
        padding: 8px 16px;
        border-radius: 6px 6px 0 0;
        display: inline-block;
        background-color: var(--unit-color, var(--brand));
        box-shadow: 0 4px 10px
          color-mix(in srgb, var(--unit-color, var(--brand)) 28%, transparent);
      }
      .checklist-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: -1px;
        table-layout: fixed;
        border-top: 2.5px solid var(--unit-color, var(--brand));
      }
      .checklist-table th,
      .checklist-table td {
        border: 1px solid #c9d1dc;
        padding: 10px 8px;
        font-size: 13px;
        line-height: 1.5;
        vertical-align: middle;
      }
      .checklist-table th {
        background-color: color-mix(
          in srgb,
          var(--unit-color, var(--brand)) 13%,
          #ffffff
        );
        color: var(--unit-color, var(--brand));
        font-weight: 900;
        text-align: center;
        border-color: color-mix(
          in srgb,
          var(--unit-color, var(--brand)) 30%,
          #c9d1dc
        );
      }
      .checklist-table th:nth-child(1) {
        width: 22%;
      }
      .checklist-table th:nth-child(3) {
        width: 112px;
      }
      .checklist-table th:nth-child(4) {
        width: 170px;
      }
      .check-row {
        transition: background 0.16s ease;
      }
      .check-row.grade-a {
        background: #eef6fe;
      }
      .check-row.grade-b {
        background: #fffdf0;
      }
      .check-row.grade-c {
        background: #fff5f5;
      }

      .editable-tag {
        font-size: 11px;
        font-weight: 700;
        color: #ffffff;
        background-color: var(--brand-2);
        padding: 2px 6px;
        border-radius: 999px;
        margin-left: 4px;
        vertical-align: middle;
      }

      .content-td,
      .solution-td {
        outline: none;
        transition:
          background 0.15s ease,
          box-shadow 0.15s ease;
        cursor: text;
      }
      .content-td:hover,
      .solution-td:hover,
      .opinion-box:hover {
        background-color: #fbfdf6;
      }
      .content-td:focus,
      .solution-td:focus,
      .opinion-box:focus {
        background-color: #fffbe6 !important;
        box-shadow: inset 0 0 0 2px rgba(214, 168, 61, 0.28);
      }
      .content-list {
        margin: 0;
        padding-left: 15px;
        color: #444444;
      }
      .content-list li {
        margin-bottom: 4px;
      }

      .grade-td {
        text-align: center;
        width: 110px;
      }
      .btn-group {
        display: flex;
        gap: 4px;
        justify-content: center;
      }
      .btn-grade {
        border: 1px solid #cbd5e1;
        background-color: #ffffff;
        padding: 6px 9px;
        min-width: 31px;
        font-size: 11px;
        font-weight: 900;
        border-radius: 6px;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      .btn-grade.active-a {
        background-color: #e3f0fc !important;
        color: #1565c0 !important;
        border-color: #1565c0 !important;
      }
      .btn-grade.active-b {
        background-color: #fff6cc !important;
        color: #a87900 !important;
        border-color: #e0a800 !important;
      }
      .btn-grade.active-c {
        background-color: #ffe1e1 !important;
        color: #c62828 !important;
        border-color: #c62828 !important;
      }

      .print-only-badge {
        display: none;
        font-weight: 900;
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 13px;
      }
      .solution-td {
        font-size: 12px;
        font-weight: 700;
        text-align: center;
        color: #4c5a6e;
        width: 170px;
        background-color: #f8fafc;
      }
      .sol-c {
        color: #c62828;
        font-weight: 700;
      }

      /* 매크로 팝오버 창 */
      #solution-macro-popover {
        position: absolute;
        display: none;
        background: #ffffff;
        border: 1px solid var(--brand);
        box-shadow: 0 14px 34px rgba(23, 32, 51, 0.2);
        border-radius: 8px;
        padding: 8px;
        z-index: 10005;
        width: min(260px, calc(100vw - 24px));
        flex-direction: column;
        gap: 5px;
      }
      .macro-btn {
        background: #f8fafc;
        border: 1px solid #cbd5e1;
        color: #334155;
        padding: 8px 10px;
        font-size: 12px;
        font-weight: 700;
        border-radius: 6px;
        text-align: left;
        cursor: pointer;
        transition: all 0.1s ease;
      }
      .macro-btn:hover {
        background: var(--brand);
        color: #ffffff;
        border-color: var(--brand);
      }

      /* [종합 피드백 블록] */
      .opinion-section {
        margin-top: 30px;
        page-break-inside: avoid;
      }
      .opinion-title {
        font-size: 15px;
        font-weight: 900;
        color: var(--brand);
        margin-bottom: 8px;
        border-left: 4px solid var(--brand-2);
        padding-left: 8px;
      }
      .feedback-generator {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f7fafb;
        padding: 12px;
        margin-bottom: 14px;
      }
      .feedback-generator-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 10px;
      }
      .feedback-generator-row:last-child {
        margin-bottom: 0;
      }
      .feedback-action {
        background: var(--brand);
        color: #ffffff;
        border: 1px solid var(--brand);
        padding: 9px 14px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 900;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          background 0.15s ease;
      }
      .feedback-action:hover {
        transform: translateY(-1px);
        background: #24466e;
      }
      .feedback-status {
        color: var(--ink-soft);
        font-size: 12px;
        font-weight: 700;
        min-height: 18px;
      }
      .feedback-modal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 18px;
        background: rgba(10, 18, 30, 0.46);
        z-index: 10020;
      }
      .feedback-modal.open {
        display: flex;
      }
      .feedback-modal-panel {
        width: min(980px, 100%);
        max-height: min(760px, calc(100vh - 36px));
        overflow: auto;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
        padding: 18px;
      }
      .feedback-modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }
      .feedback-modal-title {
        color: var(--brand);
        font-size: 16px;
        font-weight: 900;
      }
      .feedback-modal-close {
        border: 1px solid #cbd5e1;
        background: #ffffff;
        color: var(--brand);
        border-radius: 6px;
        padding: 7px 10px;
        font-size: 12px;
        font-weight: 900;
        cursor: pointer;
      }
      .candidate-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .candidate-card {
        border: 1px solid #d5dde8;
        border-radius: 8px;
        background: #ffffff;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 150px;
      }
      .candidate-title {
        color: var(--brand-2);
        font-size: 12px;
        font-weight: 900;
      }
      .candidate-text {
        color: #303a4a;
        font-size: 12px;
        line-height: 1.55;
        white-space: pre-wrap;
        flex: 1;
      }
      .candidate-apply {
        align-self: flex-start;
        border: 1px solid var(--brand-2);
        background: #ffffff;
        color: var(--brand-2);
        border-radius: 6px;
        padding: 7px 10px;
        font-size: 12px;
        font-weight: 900;
        cursor: pointer;
      }
      .candidate-apply:hover {
        background: var(--brand-2);
        color: #ffffff;
      }
      .feedback-action-soft {
        background: var(--brand-2);
        border-color: var(--brand-2);
      }
      .feedback-action-soft:hover {
        background: #285f63;
      }
      .feedback-action:disabled {
        opacity: 0.6;
        cursor: progress;
      }
      .fb-help {
        color: var(--ink-soft);
        font-size: 12.5px;
        font-weight: 600;
        line-height: 1.55;
        margin: 0 0 12px;
      }
      .kw-suggest-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .kw-suggest-chip {
        border: 1px solid var(--brand-2);
        background: #f3fafa;
        color: var(--brand-2);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          background 0.15s ease,
          color 0.15s ease;
      }
      .kw-suggest-chip:hover {
        transform: translateY(-1px);
        background: var(--brand-2);
        color: #ffffff;
      }
      .kw-suggest-chip.used {
        background: var(--brand-2);
        color: #ffffff;
        opacity: 0.7;
      }
      .chip-container {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 12px;
      }
      .opinion-chip {
        background-color: #ffffff;
        border: 1px solid #b8c5d6;
        color: var(--brand);
        padding: 7px 12px;
        font-size: 12px;
        font-weight: 700;
        border-radius: 999px;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          background 0.15s ease,
          color 0.15s ease;
      }
      .opinion-chip:hover {
        background-color: var(--brand);
        color: #ffffff;
      }
      .opinion-chip.selected {
        background-color: var(--brand-2);
        border-color: var(--brand-2);
        color: #ffffff;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
      }
      .opinion-box {
        width: 100%;
        min-height: 122px;
        border: 1px solid #b8c5d6;
        border-radius: 8px;
        padding: 15px;
        font-size: 13px;
        line-height: 1.65;
        color: #333333;
        outline: none;
        background-color: #fafafa;
        text-align: justify;
      }

      /* [우측 상단 고정 액션 독] */
      .action-dock {
        position: fixed;
        top: 18px;
        right: 18px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        background: rgba(24, 49, 83, 0.97);
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid rgba(214, 175, 55, 0.5);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.24);
        backdrop-filter: blur(10px);
      }
      .action-dock-buttons {
        display: flex;
        gap: 8px;
      }
      .action-dock-status {
        color: #f4d98a;
        font-size: 11.5px;
        font-weight: 800;
        text-align: right;
        white-space: nowrap;
      }
      .btn-action-print,
      .btn-action-image,
      .btn-action-reports {
        border: none;
        padding: 10px 16px;
        font-size: 13px;
        font-weight: 900;
        border-radius: 6px;
        cursor: pointer;

      .btn-action-print {

      .btn-action-image {
        background-color: var(--brand-2);

      .btn-action-reports {

      /* [저장된 리포트 모달] */
      .reports-modal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 18px;

        background: #ffffff;

        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;

      .reports-modal-title {
        color: var(--brand);
        font-size: 17px;
        font-weight: 900;
      }
      .reports-modal-sub {
        font-size: 12.5px;
        font-weight: 700;
        color: var(--ink-soft);
        margin-top: 3px;

      /* 검색 + 학년 필터 툴바 */
      .reports-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      .reports-search {
        flex: 1 1 200px;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 12px;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
        background: #f7faff;
      }
      .reports-search:focus {
        outline: none;
        border-color: var(--brand-2);
        background: #ffffff;
      }
      .reports-filter {
        display: flex;
        gap: 5px;
        flex-shrink: 0;
      }
      .rf-chip {
        border: 1px solid var(--line);
        background: #ffffff;
        color: var(--ink-soft);
        border-radius: 999px;
        padding: 7px 13px;
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .rf-chip:hover {
        border-color: var(--brand-2);
      }
      .rf-chip.active {
        background: var(--brand);
        border-color: var(--brand);
        color: #ffffff;

      .reports-list {
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .reports-empty {
        color: var(--ink-soft);
        font-size: 13px;
        font-weight: 600;
        text-align: center;
        padding: 32px 16px;

        padding: 14px 16px;

        color: var(--brand-2);
        cursor: pointer;
        transition: all 0.15s ease;

        background: #e8f5f5;
        transform: translateY(-1px);
      }

        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--brand-2);
        color: #ffffff;
        font-size: 22px;
        font-weight: 900;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        line-height: 1;

      .report-new-card .rnc-title {
        font-size: 14.5px;
        font-weight: 900;
      }
      .report-new-card .rnc-desc {
        font-size: 11.5px;
        font-weight: 600;
        color: var(--ink-soft);
        margin-top: 2px;
      }

      /* 저장 리포트 카드 */
      .report-card {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
        background: #ffffff;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease,
          border-color 0.15s ease;
      }
      .report-card:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 18px rgba(24, 49, 83, 0.12);

      }
      .report-card.current {
        border-color: var(--brand-2);
        box-shadow: inset 0 0 0 1.5px var(--brand-2);
        background: #f5fbfb;
      }
      .rc-top {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      .rc-grade {
        flex-shrink: 0;
        font-size: 12px;
        font-weight: 900;
        color: #ffffff;
        border-radius: 7px;
        padding: 6px 9px;
        line-height: 1;
        margin-top: 1px;
      }
      .rc-grade-mid1 {
        background: #2f6f73;
      }
      .rc-grade-mid2 {
        background: #3a5a9c;
      }
      .rc-grade-mid3 {
        background: #8a5a2b;
      }
      .rc-id {
        flex: 1;
        min-width: 0;
      }
      .rc-name {
        font-size: 15px;
        font-weight: 900;
        color: var(--ink);
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .rc-current-tag {
        font-size: 10px;
        font-weight: 900;
        color: var(--brand-2);
        background: #d9efef;
        border-radius: 999px;
        padding: 2px 7px;
      }
      .rc-meta {
        font-size: 12px;
        font-weight: 700;
        color: var(--ink-soft);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .rc-del {
        flex-shrink: 0;
        border: 1px solid transparent;
        background: transparent;
        color: var(--ink-soft);
        font-size: 15px;
        border-radius: 7px;
        padding: 5px 8px;
        cursor: pointer;
        line-height: 1;
        transition: all 0.15s ease;
      }
      .rc-del:hover {
        background: #fbeaec;
        color: var(--danger);
        border-color: #e6c2c7;
      }
      /* 분포 막대 */
      .rc-bar {
        display: flex;
        height: 12px;
        border-radius: 999px;
        overflow: hidden;
        background: #eef2f7;
        margin: 12px 0 8px;
      }
      .rc-bar .seg {
        height: 100%;
      }
      .rc-bar .seg-a {
        background: #1565c0;
      }
      .rc-bar .seg-b {
        background: #e0a800;
      }
      .rc-bar .seg-c {
        background: #c62828;
      }
      .rc-bar-empty {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 9.5px;
        font-weight: 800;
        color: #9aa7b8;
      }
      .rc-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
      }
      .rc-legend {
        display: flex;
        gap: 10px;
      }
      .rc-legend .lg {
        font-size: 11.5px;
        font-weight: 900;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .rc-legend .lg::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 50%;
      }
      .rc-legend .lg-a {
        color: #1565c0;
      }
      .rc-legend .lg-a::before {
        background: #1565c0;
      }
      .rc-legend .lg-b {
        color: #a87900;
      }
      .rc-legend .lg-b::before {
        background: #e0a800;
      }
      .rc-legend .lg-c {
        color: #c62828;
      }
      .rc-legend .lg-c::before {
        background: #c62828;
      }
      .rc-progress {
        font-size: 11px;
        font-weight: 700;
        color: var(--ink-soft);
      }

      @media (max-width: 860px) {
        body {
          padding: 14px 10px 96px;
        }
        .report-workspace {
          padding-top: 0;
        }
        .app-shell {
          display: block;
        }
        .sidebar {
          position: static;
          max-height: none;
          margin-bottom: 14px;
        }
        .grade-tab-container {
          flex-direction: row;
          position: sticky;
          top: 0;
          z-index: 50;
          border-radius: 8px 8px 0 0;
        }
        .tab-btn {
          font-size: 13px;
          padding: 10px 6px;
        }
        .report-paper {
          min-height: 0;
          padding: 18px;
          border-radius: 8px;
          overflow: visible;
        }
        .report-paper::before,
        .report-paper::after {
          display: none;
        }
        .header-section {
          flex-direction: column;
          align-items: stretch;
          padding: 18px;
        }
        .student-meta-grid {
          grid-template-columns: minmax(0, 1fr);
          flex: 0 1 auto; /* 모바일에선 데스크톱용 flex-basis(320px) 영향 제거 */
        }
        .meta-input,
        .meta-select {
          width: 100%;
          min-width: 0; /* 좁은 폭에서 컬럼이 컨테이너에 맞게 줄어들도록 */
          text-align: left;
        }
        .checklist-table,
        .checklist-table thead,
        .checklist-table tbody,
        .checklist-table tr,
        .checklist-table td {
          display: block;
          width: 100%;
        }
        .checklist-table thead {
          display: none;
        }
        .check-row {
          border: 1px solid #c9d1dc;
          border-radius: 8px;
          margin-bottom: 10px;
          overflow: hidden;
          background: #ffffff;
        }
        .checklist-table td {
          border: none;
          border-bottom: 1px solid #e5ebf2;
          padding: 10px 12px;
        }
        .checklist-table td:last-child {
          border-bottom: none;
        }
        .checklist-table td::before {
          content: attr(data-label);
          display: block;
          color: var(--brand-2);
          font-size: 11px;
          font-weight: 900;
          margin-bottom: 4px;
        }
        .grade-td,
        .solution-td {
          width: 100%;
          text-align: left;
        }
        .btn-group {
          justify-content: flex-start;
        }
        .btn-grade {
          min-width: 42px;
        }
        /* 모바일에서는 액션 독을 하단 고정 바로 전환 */
        .action-dock {
          top: auto;
          right: 0;
          left: 0;
          bottom: 0;
          flex-direction: column;
          align-items: stretch;
          gap: 6px;
          border-radius: 0;
          border: none;
          border-top: 3px solid var(--gold);
        }
        .action-dock-buttons {
          justify-content: center;
        }
        .action-dock-status {
          text-align: center;
        }
        .btn-action-print,
        .btn-action-image {
          flex: 1 1 150px;
          padding: 12px 10px;
        }
        .candidate-grid {
          grid-template-columns: 1fr;
        }
        .feedback-modal {
          align-items: stretch;
        }
      }

      /* [🖨️ 인쇄 최적화 — 학부모 배부용 A4] */
      .print-footer {
        display: none;
      }

      @media print {
        /* 화면에 보이는 배경/색을 인쇄물에도 그대로 반영 */
        *,
        *::before,
        *::after {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        @page {
          size: A4;
          margin: 9mm 10mm 11mm;
        }
        html,
        body {
          width: auto;
          height: auto;
          margin: 0 !important;
          padding: 0 !important;
          background: #ffffff !important;
          display: block !important;
          font-size: 11.6px;
        }
        .app-shell {
          display: block !important;
        }
        .report-workspace {
          display: block !important;
        }
        .no-print,
        .summary-bar,
        .btn-group,
        .editable-tag,
        .feedback-generator,
        .chip-container {
          display: none !important;
        }
        .meta-select {
          -webkit-appearance: none !important;
          -moz-appearance: none !important;
          appearance: none !important;
          border: none !important;
          background: transparent !important;
          width: 100% !important;
          flex: 1 1 auto !important;
          color: #ffffff !important;
        }
        .meta-select::-ms-expand {
          display: none !important;
        }
        .meta-input {
          border: none !important;
          color: #ffffff !important;
          width: 100% !important;
          flex: 1 1 auto !important;
        }

        /* 종이: 그림자/외곽선 제거, 페이지 폭에 맞춤 */
        .report-paper {
          box-shadow: none !important;
          border: none !important;
          width: 100% !important;
          min-height: 0 !important;
          padding: 0 !important;
          margin: 0 !important;
          display: block;
          position: static;
          overflow: visible;
        }
        /* 인쇄 시 장식 테두리 제거 — @page 여백과 충돌해 내용이 테두리 위로
           튀어나오는 문제를 막기 위해 화면에서만 표시한다 */
        .report-paper::before,
        .report-paper::after {
          display: none !important;
        }

        /* 헤더가 첫 페이지에서 잘리지 않도록 */
        .header-section {
          margin-bottom: 14px;
          padding: 12px 16px;
          page-break-inside: avoid;
        }
        .student-meta-grid {
          grid-template-columns:
            minmax(130px, 0.9fr)
            minmax(220px, 1.55fr)
            minmax(150px, 1.05fr) !important;
        }
        .meta-cell {
          min-width: 0 !important;
        }
        .main-title {
          font-size: 20px;
        }

        /* 단원 블록·행이 페이지 경계에서 쪼개지지 않도록 */
        .unit-block,
        .opinion-section,
        .check-row,
        .table-title {
          page-break-inside: avoid;
        }
        .unit-block {
          margin-bottom: 11px;
        }
        .table-title {
          padding: 6px 14px;
          font-size: 12.5px;
        }
        .opinion-section {
          margin-top: 14px;
        }

        /* A4 인쇄 폭(≈794px)은 max-width:860px 규칙을 발동시켜 표가 모바일
           '카드' 레이아웃으로 바뀐다. 인쇄에서는 원래의 표 형태로 되돌린다 */
        .checklist-table {
          display: table !important;
          width: 100% !important;
          table-layout: fixed;
        }
        .checklist-table thead {
          display: table-header-group !important; /* 페이지마다 머리글 반복 */
        }
        .checklist-table tbody {
          display: table-row-group !important;
        }
        .checklist-table tr,
        .check-row {
          display: table-row !important;
          border: 0 !important;
          border-radius: 0 !important;
          margin-bottom: 0 !important;
          overflow: visible !important;
        }
        /* 단원 설정에서 끈(숨긴) 소단원·단원은 인쇄에서도 숨긴다.
           위 display:table-row !important 가 인라인 display:none 을 덮어쓰지
           않도록, 더 높은 우선순위로 다시 숨김 처리한다. */
        .checklist-table tr[style*="display: none"],
        .check-row[style*="display: none"],
        .unit-block[style*="display: none"] {
          display: none !important;
        }
        .checklist-table td {
          display: table-cell !important;
          width: auto;
          border: 1px solid #c9d1dc !important;
          border-radius: 0 !important;
          text-align: left;
          padding: 7px 8px;
          font-size: 11.4px;
        }
        .checklist-table th {
          padding: 7px 8px;
          font-size: 11.4px;
        }
        /* 카드 레이아웃에서 셀 앞에 붙던 라벨(중단원/주요내용 등) 숨김 */
        .checklist-table td::before {
          content: none !important;
          display: none !important;
        }
        .grade-td {
          text-align: center !important;
        }

        .print-only-badge {
          display: inline-block !important;
        }
        .content-td,
        .solution-td {
          background-color: transparent !important;
        }
        .opinion-box {
          background-color: #ffffff !important;
          border: 1px solid var(--line) !important;
          min-height: 92px;
        }

        /* 푸터 — 일반 흐름(static)으로 보고서 맨 끝에 한 번 표시.
           position:fixed 를 쓰면 @page 여백 기준으로 떠서 내용 위로 겹치거나
           페이지 밖으로 튀어나오므로 사용하지 않는다 */
        .print-footer {
          display: flex !important;
          position: static;
          margin-top: 18px;
          padding-top: 10px;
          border-top: 1px solid var(--line);
          justify-content: space-between;
          align-items: center;
          font-size: 9.5px;
          font-weight: 700;
          color: var(--brand);
          letter-spacing: 0.4px;
          page-break-inside: avoid;
        }
        .print-footer .pf-brand {
          color: var(--brand-2);
        }
        .print-footer .pf-date {
          color: var(--ink-soft);
        }
      }
    </style>

      function ensureAllRowsGraded(actionLabel) {
        const ungradedRows = getUngradedRows();
        if (!ungradedRows.length) return true;

        const preview = ungradedRows
          .slice(0, 5)
          .map((row) => getTextFromElement(row.querySelector("td")))
          .join(", ");
        const suffix =
          ungradedRows.length > 5 ? ` 외 ${ungradedRows.length - 5}개` : "";
        alert(
          `아직 평가하지 않은 항목이 ${ungradedRows.length}개 있습니다.\n${preview}${suffix}\n\n${actionLabel} 전에 A/B/C 평가를 모두 선택해 주세요.`,
        );
        return false;
      }

      // SOLUTION이 비어 있는(또는 "-"만 있는) 표시 중인 행
      function getEmptySolutionRows() {
        return getVisibleRows().filter((row) => {
          const sol = getTextFromElement(row.querySelector(".solution-td"));
          return sol === "" || sol === "-";
        });
      }

      function rowLabel(row) {
        return getTextFromElement(row.querySelector("td"));

      // 인쇄/이미지 저장 전 필수 입력 검증.
      // 진단평가·SOLUTION·이름·학교명 중 하나라도 비어 있으면 차단(false 반환).
      function ensureReadyForOutput(actionLabel) {
        // 1) 진단평가(A/B/C) 미선택 항목
        const ungraded = getUngradedRows();
        if (ungraded.length) {
          const preview = ungraded.slice(0, 5).map(rowLabel).join(", ");
          const suffix =
            ungraded.length > 5 ? ` 외 ${ungraded.length - 5}개` : "";
          alert(
            `진단평가(A/B/C)를 선택하지 않은 항목이 ${ungraded.length}개 있습니다.\n${preview}${suffix}\n\n모든 항목을 평가해야 ${actionLabel}할 수 있습니다.`,
          );
          ungraded[0].scrollIntoView({ behavior: "smooth", block: "center" });
          return false;
        }
        // 2) SOLUTION 미입력 항목
        const noSol = getEmptySolutionRows();
        if (noSol.length) {
          const preview = noSol.slice(0, 5).map(rowLabel).join(", ");
          const suffix = noSol.length > 5 ? ` 외 ${noSol.length - 5}개` : "";
          alert(
            `SOLUTION이 비어 있는 항목이 ${noSol.length}개 있습니다.\n${preview}${suffix}\n\n모든 항목의 SOLUTION을 입력해야 ${actionLabel}할 수 있습니다.`,
          );
          noSol[0].scrollIntoView({ behavior: "smooth", block: "center" });
          return false;
        }
        // 3) 학생 이름·학교명
        const nameEl = document.getElementById("student-name");
        const schoolEl = document.getElementById("school-name");
        const name = nameEl.value.trim();
        const school = schoolEl.value.trim();
        const missing = [];
        if (!name) missing.push("학생 이름");
        if (!school) missing.push("학교명");
        if (missing.length) {
          alert(
            `${missing.join(", ")}을(를) 입력해야 ${actionLabel}할 수 있습니다.`,
          );
          (name ? schoolEl : nameEl).focus();
          return false;
        }
        // 4) AI가 생성한 종합 의견을 거의 그대로 출력하려는 경우 차단.
        //    선생님이 직접 ${AI_EDIT_THRESHOLD}자 이상 손봐야 출력할 수 있다.
        if (lastAiOpinionText) {
          const current = normalizeForCompare(
            getTextFromElement(document.getElementById("opinion-textarea")),
          );
          const diff = editDistance(current, lastAiOpinionText);
          if (diff < AI_EDIT_THRESHOLD) {
            alert(
              `AI가 생성한 종합 의견을 거의 그대로 ${actionLabel}하려고 합니다.\n` +
                `현재는 AI 문장과 ${diff}자만 다릅니다.\n\n` +
                `선생님의 검토·수정을 거쳐 AI 문장과 ${AI_EDIT_THRESHOLD}자 이상 다르게 고친 뒤 ${actionLabel}해 주세요.`,
            );
            document.getElementById("opinion-textarea").focus();
            return false;
          }
        }
        return true;
      }

          } else {

          }

      // html2canvas는 input/select의 텍스트를 위로 붙여 잘라 그리는 버그가 있다.
      // 캡처하는 순간에만 같은 값을 가진 일반 span 으로 바꿔 정확히 렌더되게 한다.
      function swapMetaFieldsForCapture() {
        const ctrls = [
          document.getElementById("student-name"),
          document.getElementById("school-name"),
          document.getElementById("exam-type"),
        ].filter(Boolean);
        const created = [];
        ctrls.forEach((ctrl) => {
          const text =
            ctrl.tagName === "SELECT"
              ? (ctrl.options[ctrl.selectedIndex] || {}).text || ""
              : ctrl.value || "";
          const cs = getComputedStyle(ctrl);
          const span = document.createElement("span");
          span.className = "capture-meta-text";
          span.textContent = text;
          span.style.color = "#ffffff";
          span.style.fontSize = cs.fontSize;
          span.style.fontWeight = cs.fontWeight;
          span.style.fontFamily = cs.fontFamily;
          span.style.letterSpacing = cs.letterSpacing;
          span.style.whiteSpace = "nowrap";
          span.style.lineHeight = "1.5";
          span.style.padding = "2px 4px";
          span.style.borderBottom =
            cs.borderBottomWidth +
            " " +
            cs.borderBottomStyle +
            " " +
            cs.borderBottomColor;
          ctrl.style.display = "none";
          ctrl.parentNode.insertBefore(span, ctrl);
          created.push({ ctrl, span });
        });
        return () => {
          created.forEach(({ ctrl, span }) => {
            if (span.parentNode) span.parentNode.removeChild(span);
            ctrl.style.display = "";
          });
        };
      }

      function saveAsImageFile() {
        if (!ensureReadyForOutput("이미지 저장")) return;
        rememberSchoolPreset(); // 이 학교의 단원 선택을 기억(다음에 자동 적용)
        hideMacroPopover();

        const btnGroups = document.querySelectorAll(".btn-group");
        const badges = document.querySelectorAll(".print-only-badge");
        const tags = document.querySelectorAll(".editable-tag");
        const captureOnlyControls = document.querySelectorAll(
          "#capture-target-paper .no-print",
        );

        let captureFailed = false;
        const restoreMetaFields = swapMetaFieldsForCapture();
        const restoreCaptureChrome = () => {
          restoreMetaFields();
          btnGroups.forEach((g) => (g.style.display = "flex"));
          tags.forEach((t) => (t.style.display = "inline-block"));
          captureOnlyControls.forEach((el) => (el.style.display = ""));
          badges.forEach((b) => (b.style.display = "none"));
          if (!captureFailed) updateStatus();
        };
        const statusText = document.getElementById("report-status");
        const previousStatus = statusText ? statusText.textContent : "";
        if (statusText) statusText.textContent = "이미지 저장 준비 중...";
        btnGroups.forEach((g) => (g.style.display = "none"));
        tags.forEach((t) => (t.style.display = "none"));
        captureOnlyControls.forEach((el) => (el.style.display = "none"));
        badges.forEach((b) => {
          if (b.innerText !== "-") b.style.display = "inline-block";
        });

        const target =
          document.getElementById("capture-target- 대지") ||
          document.getElementById("capture-target-paper") ||
          document.querySelector(".report-paper");

        html2canvas(target, {
          scale: 2,
          useCORS: true,
          backgroundColor: "#ffffff",
          logging: false,
        })
          .then((canvas) => {
            const link = document.createElement("a");
            link.download = document.title + ".png";
            link.href = canvas.toDataURL("image/png");
            link.click();
          })
          .catch((err) => {
            console.warn("이미지 저장 실패", err);
            captureFailed = true;
            if (statusText)
              statusText.textContent =
                "이미지 저장에 실패했습니다. 다시 시도해 주세요.";
            setTimeout(() => {
              if (statusText) statusText.textContent = previousStatus;
              updateStatus();
            }, 2200);
          })
          .finally(restoreCaptureChrome);
      }

      function toggleBigBlock(key, checkbox) {
        const gradeKey = key.split("-")[0];
        const idx = key.split("-")[1];
        const block = document.getElementById(`${gradeKey}-unit-idx-${idx}`);
        if (block) block.style.display = checkbox.checked ? "block" : "none";
        const parent = checkbox.closest(".scope-group");
        parent.querySelectorAll(".sub-scope-checkbox").forEach((cb) => {
          cb.checked = checkbox.checked;
          const r = document.getElementById(
            `${cb.getAttribute("data-target")}-row`,
          );
          if (r) r.style.display = checkbox.checked ? "" : "none";
        });
        saveCurrentState();
        updateStatus();
      }

      function toggleSubRow(checkbox) {
        const targetId = checkbox.getAttribute("data-target");
        const row = document.getElementById(`${targetId}-row`);
        if (row) row.style.display = checkbox.checked ? "" : "none";
        const parent = checkbox.closest(".scope-group");
        const bigCb = parent.querySelector(".group-header-checkbox");
        const subCbs = parent.querySelectorAll(".sub-scope-checkbox");
        const hasAny = Array.from(subCbs).some((c) => c.checked);
        const idx = bigCb.getAttribute("data-idx");
        const block = document.getElementById(
          `${currentGrade}-unit-idx-${idx}`,
        );
        if (!hasAny) {
          bigCb.checked = false;
          if (block) block.style.display = "none";
        } else {
          if (!bigCb.checked) {
            bigCb.checked = true;
            if (block) block.style.display = "block";
          }
        }
        saveCurrentState();
        updateStatus();
      }

      function setAllScopes(status) {
        document.querySelectorAll(".group-header-checkbox").forEach((cb) => {
          cb.checked = status;
          const idx = cb.getAttribute("data-idx");
          const block = document.getElementById(
            `${currentGrade}-unit-idx-${idx}`,
          );
          if (block) block.style.display = status ? "block" : "none";
        });
        document.querySelectorAll(".sub-scope-checkbox").forEach((cb) => {
          cb.checked = status;
          const r = document.getElementById(
            `${cb.getAttribute("data-target")}-row`,
          );
          if (r) r.style.display = status ? "" : "none";
        });
        saveCurrentState();
        updateStatus();
      }

      /* ───────── 학교 프리셋: 입력한 학교명이 프리셋과 일치하면 단원 자동 적용 ───────── */

      // 대단원 번호 배열(또는 "all")로 단원 설정 체크 상태를 일괄 지정
      function applyScopeUnits(spec) {
        const all = spec === "all";
        const set = new Set((Array.isArray(spec) ? spec : []).map(Number));
        document.querySelectorAll(".scope-group").forEach((group) => {
          const groupCb = group.querySelector(".group-header-checkbox");
          const idx = Number(groupCb.getAttribute("data-idx"));
          const on = all || set.has(idx + 1); // 대단원 번호 = idx+1
          groupCb.checked = on;
          const block = document.getElementById(
            `${currentGrade}-unit-idx-${idx}`,
          );
          if (block) block.style.display = on ? "block" : "none";
          group.querySelectorAll(".sub-scope-checkbox").forEach((cb) => {
            cb.checked = on;
            const r = document.getElementById(
              `${cb.getAttribute("data-target")}-row`,
            );
            if (r) r.style.display = on ? "" : "none";
          });
        });
        saveCurrentState();
        updateStatus();
      }

      /* ── 학교별 단원 선택 자동 학습(브라우저 저장) ──
         사용자가 인쇄/이미지 저장을 누르면 그때의 (학교+학년+시험)별 단원 선택을
         기억해 두고, 다음에 같은 학교명을 입력하면 자동으로 복원한다. */
      const LEARNED_PRESETS_KEY = "nature_learned_school_presets";

      function loadLearnedPresets() {
        try {
          return (
            JSON.parse(localStorage.getItem(LEARNED_PRESETS_KEY) || "{}") || {}
          );
        } catch (e) {
          return {};
        }
      }
      function saveLearnedPresets(obj) {
        try {
          localStorage.setItem(LEARNED_PRESETS_KEY, JSON.stringify(obj));
        } catch (e) {
          console.warn("학교 프리셋 저장 실패", e);
        }
      }

      // 현재 단원 설정(체크 상태)을 sub-unit 단위 맵으로 수집
      function getCurrentScopeSelections() {
        const map = {};
        document.querySelectorAll(".sub-scope-checkbox").forEach((cb) => {
          map[cb.getAttribute("data-target")] = cb.checked;

        return map;

      // 현재 (학교+학년+시험)의 단원 선택을 학습 저장 (인쇄/이미지 저장 시 호출)
      function rememberSchoolPreset() {
        const school = document.getElementById("school-name").value.trim();
        if (!school) return;
        const exam = document.getElementById("exam-type").value;
        const store = loadLearnedPresets();
        if (!store[school]) store[school] = {};
        if (!store[school][currentGrade]) store[school][currentGrade] = {};
        store[school][currentGrade][exam] = {
          scope: getCurrentScopeSelections(),
          updatedAt: Date.now(),
        };
        saveLearnedPresets(store);
      }

      // 현재 학교+학년+시험에 해당하는 프리셋이 있으면 단원 설정에 적용.
      // ① 사용자가 학습시킨 저장값 우선 → ② 코드 내장 예시(SCHOOL_PRESETS) 순.
      function applySchoolPreset() {
        const school = document.getElementById("school-name").value.trim();
        if (!school) return false;
        const exam = document.getElementById("exam-type").value;

        // ① 학습된 프리셋 (sub-unit 단위로 정확히 복원)
        const learned = loadLearnedPresets();
        const entry =
          learned[school] &&
          learned[school][currentGrade] &&
          learned[school][currentGrade][exam];
        if (entry && entry.scope) {
          restoreScopeSelections(entry.scope);
          saveCurrentState();
          updateStatus();
          return true;
        }

        // ② 코드에 내장된 예시 프리셋 (대단원 번호 기준)
        const preset =
          SCHOOL_PRESETS[school] &&
          SCHOOL_PRESETS[school][currentGrade] &&
          SCHOOL_PRESETS[school][currentGrade][exam];
        if (preset !== undefined) {
          applyScopeUnits(preset);
          return true;
        }
        return false; // 프리셋 없음 → 현재 설정 유지
      }

      // 학교명을 입력할 때: 저장 + 입력한 학교명이 프리셋과 정확히 일치하면
      // 해당 학년·시험 단원 범위를 자동 적용
      function onSchoolNameInput() {
        syncFilenameAndSave();
        applySchoolPreset();

      function onExamChange() {

        applySchoolPreset(); // 프리셋 학교면 시험 변경 시 범위 자동 갱신

        // SOLUTION 칸은 진단평가와 독립적인 자유 입력란 — 등급 선택 시 건드리지 않는다.

      function updateTitle() {
        const sName =
          document.getElementById("student-name").value.trim() || "미입력";

        let gradeLabel =

      function syncFilenameAndSave() {
