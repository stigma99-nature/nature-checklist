      let feedbackCandidates = [];
      // AI가 생성해 의견란에 그대로 넣은 마지막 텍스트(평문).
      // 인쇄/저장 시 현재 의견과 비교해 거의 그대로면 출력을 막는다.
      let lastAiOpinionText = "";
      // AI 생성 내용과 최소 이만큼(글자 수)은 달라야 출력을 허용한다.
      const AI_EDIT_THRESHOLD = 10;

      // 두 문자열의 편집 거리(Levenshtein). 글자 단위로 몇 글자나 다른지 센다.
      function editDistance(a, b) {
        a = a || "";
        b = b || "";
        if (a === b) return 0;
        if (!a.length) return b.length;
        if (!b.length) return a.length;
        let prev = new Array(b.length + 1);
        let curr = new Array(b.length + 1);
        for (let j = 0; j <= b.length; j++) prev[j] = j;
        for (let i = 1; i <= a.length; i++) {
          curr[0] = i;
          for (let j = 1; j <= b.length; j++) {
            const cost = a[i - 1] === b[j - 1] ? 0 : 1;
            curr[j] = Math.min(
              prev[j] + 1, // 삭제
              curr[j - 1] + 1, // 삽입
              prev[j - 1] + cost, // 치환
            );
          }
          [prev, curr] = [curr, prev];
        }
        return prev[b.length];
      }

      // 공백을 정규화한 평문으로 변환(비교 기준 통일).
      function normalizeForCompare(text) {
        return String(text || "")
          .replace(/\s+/g, " ")
          .trim();
      }

      function getTextFromElement(el) {
        return (el?.innerText || el?.textContent || "")
          .replace(/\s+/g, " ")
          .trim();
      }

      function getActiveGrade(row) {
        if (row.querySelector(".active-a")) return "A";
        if (row.querySelector(".active-b")) return "B";
        if (row.querySelector(".active-c")) return "C";
        return "-";
      }

      function getGradeLabel() {
        if (currentGrade === "mid2") return "중2 과학";
        if (currentGrade === "mid3") return "중3 과학";
        return "중1 과학";
      }

      function collectFeedbackContext() {
        const rows = Array.from(document.querySelectorAll(".check-row")).filter(
          (row) => row.style.display !== "none",
        );
        const items = rows.map((row) => {
          const cells = row.querySelectorAll("td");
          return {
            unit: getTextFromElement(
              row.closest(".unit-block")?.querySelector(".table-title"),
            ),
            topic: getTextFromElement(cells[0]),
            content: getTextFromElement(row.querySelector(".content-td")),
            grade: getActiveGrade(row),
            solution: getTextFromElement(row.querySelector(".solution-td")),
          };
        });
        const counts = {
          A: items.filter((item) => item.grade === "A").length,
          B: items.filter((item) => item.grade === "B").length,
          C: items.filter((item) => item.grade === "C").length,
          none: items.filter((item) => item.grade === "-").length,
        };

        return {
          studentName:
            document.getElementById("student-name").value.trim() || "해당",
          schoolName:
            document.getElementById("school-name").value.trim() || "학교",
          examType: document.getElementById("exam-type").value,
          gradeLabel: getGradeLabel(),
          selectedKeywords: getSelectedKeywords(),
          visibleCount: items.length,
          counts,
          items,
        };
      }

      function compactList(items, fallback, limit = 4) {
        if (!items.length) return fallback;
        return items
          .slice(0, limit)
          .map((item) => `${item.topic}(${item.unit.replace(/^\d+\.\s*/, "")})`)
          .join(", ");
      }

      function buildLocalFeedbackCandidates(context) {
        const weakC = context.items.filter((item) => item.grade === "C");
        const weakB = context.items.filter((item) => item.grade === "B");
        const ungraded = context.items.filter((item) => item.grade === "-");
        const strong = context.items.filter((item) => item.grade === "A");
        const focus = [...weakC, ...weakB, ...ungraded];
        const strongText = compactList(strong, "기본 개념 확인 단원");
        const weakText = compactList(focus, "아직 평가가 입력되지 않은 단원");
        const urgentText = compactList(
          weakC.length ? weakC : weakB,
          weakText,
          3,
        );
        const scoreText = `A ${context.counts.A}개, B ${context.counts.B}개, C ${context.counts.C}개`;
        const keywordText = context.selectedKeywords.length
          ? ` 참고 키워드는 ${context.selectedKeywords.join(", ")}입니다.`
          : "";

        return [
          {
            title: "균형형",
            text: `${context.studentName} 학생은 ${context.gradeLabel} ${context.examType} 대비 과정에서 ${strongText}은 비교적 안정적이나, ${weakText}에서 보완이 필요합니다. 현재 진단은 ${scoreText}이므로 시험 전 ${urgentText}을 중심으로 개념 재정리와 유사 문항 확인을 짧게 반복하면 실전 감점을 줄이는 데 도움이 되겠습니다.${keywordText}`,
          },
          {
            title: "실행계획형",
            text: `${context.studentName} 학생은 ${strongText}에서 수업 이해 흐름이 보이지만, ${weakText}은 시험 전 우선 점검이 필요합니다. 남은 기간에는 취약 단원 개념 정리, 대표 오답 재풀이, 서술형 조건 확인 순서로 마무리하고 특히 ${urgentText}은 추가 확인 과제로 짚어보면 좋겠습니다.${keywordText}`,
          },
          {
            title: "학부모 안내형",
            text: `${context.studentName} 학생은 ${context.schoolName} ${context.examType} 준비에서 전체 ${context.visibleCount}개 항목 중 ${context.counts.A + context.counts.B + context.counts.C}개가 평가되었고, 강점은 ${strongText}, 보완 포인트는 ${weakText}입니다. 새로운 문제를 많이 늘리기보다 취약 단원의 오답 원인과 풀이 조건을 정리하는 방향으로 마무리하면 좋겠습니다.${keywordText}`,
          },
        ];
      }

      function renderFeedbackCandidates(candidates) {
        feedbackCandidates = candidates.slice(0, 3);
        const body = document.getElementById("feedback-modal-body");
        const title = document.getElementById("feedback-modal-title");
        if (title) title.textContent = "✨ 이렇게 말씀해 보시면 어떨까요?";
        body.innerHTML =
          '<p class="fb-help">선생님이 작성하신 내용을 바탕으로 AI가 학부모 상담 때 말씀하실 멘트로 바꿔 보았습니다. 마음에 드는 표현을 적용해 보세요.</p>' +
          '<div class="candidate-grid">' +
          feedbackCandidates
            .map(
              (candidate, idx) => `
                <div class="candidate-card">
                    <div class="candidate-title">${escapeHtml(candidate.title || `제안 ${idx + 1}`)}</div>
                    <div class="candidate-text">${escapeHtml(candidate.text || "")}</div>
                    <button type="button" class="candidate-apply" onclick="applyFeedbackCandidate(${idx})">이 표현 적용</button>
                </div>`,
            )
            .join("") +
          "</div>";
        openFeedbackModal();
      }

      function escapeHtml(text) {
        return String(text).replace(
          /[&<>"']/g,
          (ch) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[ch],
        );
      }

      function applyFeedbackCandidate(index) {
        const candidate = feedbackCandidates[index];
        if (!candidate) return;
        document.getElementById("opinion-textarea").innerHTML = escapeHtml(
          candidate.text,
        ).replace(/\n/g, "<br>");
        // AI가 그대로 넣은 원문을 기억해 둔다(인쇄 시 비교용).
        lastAiOpinionText = normalizeForCompare(candidate.text);
        closeFeedbackModal();
        saveCurrentState();
      }

      function openFeedbackModal() {
        document.getElementById("feedback-modal")?.classList.add("open");
      }

      function closeFeedbackModal(event) {
        if (event && !event.target.classList.contains("feedback-modal")) return;
        document.getElementById("feedback-modal")?.classList.remove("open");
      }

      function extractOpenAIText(data) {
        if (data.output_text) return data.output_text;
        const firstText = data.output
          ?.flatMap((item) => item.content || [])
          .find(
            (content) =>
              content.type === "output_text" || content.type === "text",
          );
        return firstText?.text || "";
      }

      /* ───────── AI 종합의견 도우미 (OpenAI, 서버리스 프록시 경유) ───────── */

      function setFeedbackStatus(msg) {
        const s = document.getElementById("feedback-status");
        if (s) s.textContent = msg;
      }

      function parseJsonLoose(text) {
        // ```json ... ``` 펜스 제거 후 파싱, 실패 시 본문에서 첫 {…} 추출
        const cleaned = String(text)
          .replace(/^```json\s*|\s*```$/g, "")
          .trim();
        try {
          return JSON.parse(cleaned);
        } catch (e) {
          const m = cleaned.match(/\{[\s\S]*\}/);
          if (m) return JSON.parse(m[0]);
          throw e;
        }
      }

      // 서버리스 함수(/api/ai)에 프롬프트를 보내 결과 텍스트만 받아온다.
      // 실제 OpenAI 호출과 API 키 사용은 서버에서만 이뤄진다.
      async function callOpenAIResponses(prompt) {
        // 파일을 직접 열면(file://) 서버 함수(/api/ai)에 접근할 수 없다.
        if (location.protocol !== "http:" && location.protocol !== "https:") {
          throw new Error(
            "AI 기능은 배포된 주소(Vercel) 또는 로컬 서버에서만 동작합니다. HTML 파일을 직접 열지 말고 배포 주소로 접속해 주세요.",
          );
        }
        let res;
        try {
          res = await fetch("/api/ai", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt }),
          });
        } catch (e) {
          throw new Error(
            "서버에 연결하지 못했습니다. 배포 환경(Vercel) 또는 로컬 서버에서 실행 중인지 확인해 주세요.",
          );
        }
        let data = {};
        try {
          data = await res.json();
        } catch (e) {}
        if (!res.ok) {
          throw new Error(data.error || `요청 실패: ${res.status}`);
        }
        return (data.text || "").trim();
      }

      // 버튼 비활성/상태표시/에러처리를 감싸는 실행 헬퍼
      async function runAiTask(btnId, workingMsg, fn) {
        const btn = document.getElementById(btnId);
        if (btn) btn.disabled = true;
        setFeedbackStatus(workingMsg);
        try {
          await fn();
        } catch (e) {
          console.warn(e);
          setFeedbackStatus(
            "AI 요청에 실패했습니다. 잠시 후 다시 시도해 주세요. (" +
              (e && e.message ? e.message.slice(0, 120) : e) +
              ")",
          );
        } finally {
          if (btn) btn.disabled = false;
        }
      }

      // ① 종합의견에 넣으면 좋은 키워드 추천
      async function suggestOpinionKeywords() {
        const context = collectFeedbackContext();
        if (!context.items.length) {
          setFeedbackStatus("표시된 단원이 없어 분석할 수 없습니다.");
          return;
        }
        await runAiTask(
          "ai-keywords-btn",
          "AI가 진단 내용을 분석해 핵심 키워드를 정리하는 중...",
          async () => {
            const prompt = [
              "당신은 중등 과학 학원의 베테랑 지도교사를 돕는 보조입니다.",
              "아래 학생 진단 데이터(JSON)를 분석해, 네이쳐 과학학원 선생님이 학부모님께 보낼 '종합 의견'에 언급하면 좋은 핵심 키워드/포인트를 제안하세요.",
              "조건:",
              "- 학부모님께 전하는 정중한 안내 맥락입니다.",
              "- 각 항목은 짧은 한국어 명사구로 작성하세요. (예: '개념 이해 우수', '서술형 답안 보완 필요', '오답 정리 습관 권장')",
              "- 강점과 보완점을 균형 있게 포함하고, 최대 8개까지.",
              "- 데이터에 근거가 없는 내용은 지어내지 마세요.",
              '반드시 JSON만 반환하세요. 형식: {"keywords":["...","..."]}',
              "",
              JSON.stringify(context),
            ].join("\n");
            const text = await callOpenAIResponses(prompt);
            const parsed = parseJsonLoose(text);
            const keywords = (parsed.keywords || [])
              .map((k) => String(k).trim())
              .filter(Boolean)
              .slice(0, 10);
            if (!keywords.length)
              throw new Error("키워드를 생성하지 못했습니다.");
            renderKeywordSuggestions(keywords);
            setFeedbackStatus(
              `AI가 키워드 ${keywords.length}개를 제안했습니다. 모달에서 눌러 의견란에 추가하세요.`,
            );
          },
        );
      }

      let keywordSuggestions = [];
      function renderKeywordSuggestions(keywords) {
        keywordSuggestions = keywords;
        const body = document.getElementById("feedback-modal-body");
        const title = document.getElementById("feedback-modal-title");
        if (title) title.textContent = "💡 종합 의견에 넣으면 좋은 키워드";
        body.innerHTML =
          '<p class="fb-help">선생님이 직접 작성하시되, 아래 키워드를 참고하세요. 키워드를 누르면 의견란 끝에 추가됩니다. (문장은 선생님이 자연스럽게 다듬어 주세요.)</p>' +
          '<div class="kw-suggest-grid">' +
          keywords
            .map(
              (k, i) =>
                `<button type="button" class="kw-suggest-chip" data-idx="${i}" onclick="insertKeyword(${i}, this)">＋ ${escapeHtml(k)}</button>`,
            )
            .join("") +
          "</div>";
        openFeedbackModal();
      }

      function insertKeyword(i, btn) {
        const k = keywordSuggestions[i];
        if (!k) return;
        const editor = document.getElementById("opinion-textarea");
        const current = editor.innerHTML.trim();
        const piece = escapeHtml(k);
        editor.innerHTML = current
          ? current + (current.endsWith("<br>") ? "" : "<br>") + "· " + piece
          : "· " + piece;
        if (btn) btn.classList.add("used");
        saveCurrentState();
        setFeedbackStatus(`'${k}' 키워드를 의견란에 추가했습니다.`);
      }

      // ② 선생님이 쓴 글을 학부모용으로 정중하게 다듬기
      async function polishOpinion() {
        const editor = document.getElementById("opinion-textarea");
        const draft = getTextFromElement(editor);
        if (!draft) {
          setFeedbackStatus(
            "먼저 의견을 작성해 주세요. 작성하신 내용을 AI가 정중하게 다듬어 드립니다.",
          );
          editor.focus();
          return;
        }
        const context = collectFeedbackContext();
        await runAiTask(
          "ai-polish-btn",
          "AI가 학부모 상담 때 말씀하실 멘트로 다듬는 중...",
          async () => {
            // 첫 인사는 고정 멘트. 이름이 있으면 넣고, 없으면 ○○○ 로 둔다.
            const greetName =
              context.studentName && context.studentName !== "해당"
                ? context.studentName
                : "○○○";
            const prompt = [
              "당신은 네이쳐 과학학원 선생님이 '학부모 상담'에서 실제로 말할 상담 멘트(구어체 대본)를 만들어 주는 보조입니다.",
              "아래 [선생님 초안]을 바탕으로, 선생님이 학부모님과 마주 앉아(또는 전화로) 상담할 때 입으로 말할 수 있는 자연스러운 구어체 멘트로 바꿔 주세요.",
              "조건:",
              `- 모든 버전은 반드시 "안녕하세요, ${greetName} 학부모님." 으로 시작하세요. (이 첫 인사는 고정 멘트입니다.)`,
              "- 글로 보내는 안내문이 아니라, 선생님이 직접 말로 전하는 상담 대화체로 작성하세요. (예: '~하더라고요', '~한 편이에요', '~해 보시면 좋을 것 같아요')",
              "- 실제 상담 자리에서 자연스럽게 나올 법한 말투로, 학생의 강점은 칭찬으로 먼저 전하고 보완점은 부드럽게 짚어 주세요.",
              "- 초안에 없는 사실·평가·수치를 새로 지어내지 마세요.",
              "- 첫 인사 뒤로는 한 호흡에 말할 수 있는 분량(3~5문장)으로, 끝은 가볍게 마무리하세요.",
              "- 3가지 버전을 제안하세요. (예: '핵심만 간결하게', '따뜻하게 격려 중심', '집에서 할 일까지 안내')",
              '반드시 JSON만 반환하세요. 형식: {"versions":[{"title":"...","text":"..."},{"title":"...","text":"..."},{"title":"...","text":"..."}]}',
              "",
              "[참고 진단 요약] " +
                JSON.stringify({
                  studentName: context.studentName,
                  gradeLabel: context.gradeLabel,
                  examType: context.examType,
                  counts: context.counts,
                }),
              "[선생님 초안]",
              draft,
            ].join("\n");
            const text = await callOpenAIResponses(prompt);
            const parsed = parseJsonLoose(text);
            const versions = (parsed.versions || [])
              .filter((v) => v && v.text)
              .slice(0, 3);
            if (!versions.length)
              throw new Error("다듬은 결과를 생성하지 못했습니다.");
            renderFeedbackCandidates(versions);
            setFeedbackStatus(
              "상담 때 말씀하실 멘트 제안입니다. ‘이 표현 적용’을 누르면 의견란에 반영됩니다.",
            );
          },
        );
      }

      function getSelectedKeywords() {
        return Array.from(
          document.querySelectorAll(".opinion-chip.selected"),
        ).map((chip) => chip.dataset.keyword || chip.textContent.trim());
      }

      function toggleKeyword(button) {
        button.classList.toggle("selected");
        button.setAttribute(
          "aria-pressed",
          button.classList.contains("selected") ? "true" : "false",
        );
        saveCurrentState();
      }

      function updateStatus() {
        const rows = Array.from(document.querySelectorAll(".check-row"));
        const visibleRows = rows.filter((row) => row.style.display !== "none");
        const gradedRows = visibleRows.filter((row) =>
          row.querySelector(".active-a, .active-b, .active-c"),
        );
        const countA = visibleRows.filter((row) =>
          row.querySelector(".active-a"),
        ).length;
        const countB = visibleRows.filter((row) =>
          row.querySelector(".active-b"),
        ).length;
        const countC = visibleRows.filter((row) =>
          row.querySelector(".active-c"),
        ).length;
        const visibleGroups = Array.from(
          document.querySelectorAll(".group-header-checkbox"),
        ).filter((cb) => cb.checked).length;
        const totalGroups = document.querySelectorAll(
          ".group-header-checkbox",
        ).length;
        const reportStatus = document.getElementById("report-status");
        const scopeStatus = document.getElementById("scope-status");

        if (reportStatus)
          reportStatus.textContent = `평가 ${gradedRows.length}/${visibleRows.length}개 완료 · A ${countA} / B ${countB} / C ${countC}`;
        if (scopeStatus)
          scopeStatus.textContent = `표시 단원 ${visibleGroups}/${totalGroups}`;
      }

      function restoreScopeSelections(scopeSelections) {
        document.querySelectorAll(".sub-scope-checkbox").forEach((cb) => {
          const targetId = cb.getAttribute("data-target");
          if (Object.prototype.hasOwnProperty.call(scopeSelections, targetId)) {
            cb.checked = scopeSelections[targetId];
          }
          const row = document.getElementById(`${targetId}-row`);
          if (row) row.style.display = cb.checked ? "" : "none";
        });

        document.querySelectorAll(".scope-group").forEach((group) => {
          const groupCb = group.querySelector(".group-header-checkbox");
          const subCbs = Array.from(
            group.querySelectorAll(".sub-scope-checkbox"),
          );
          const hasAny = subCbs.some((cb) => cb.checked);
          groupCb.checked = hasAny;
          const idx = groupCb.getAttribute("data-idx");
          const block = document.getElementById(
            `${currentGrade}-unit-idx-${idx}`,
          );
          if (block) block.style.display = hasAny ? "block" : "none";
        });
      }

      /* ============================================================
         IndexedDB 기반 다중 리포트 자동 저장/불러오기
         - 리포트는 (학년 + 이름 + 학교 + 시험)으로 구분된다.
         - 편집 시 자동 저장되고, 초기화해도 저장본은 남는다.
         ============================================================ */
      const DB_NAME = "nature_checklist_db";
      const DB_STORE = "reports";
      let _dbPromise = null;
      let lastSavedId = null; // 현재 작업 중인 리포트가 저장된 id
      let saveTimer = null;
      let DEFAULT_OPINION = "";

      function openDB() {
        if (_dbPromise) return _dbPromise;
        _dbPromise = new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(DB_STORE)) {
              const store = db.createObjectStore(DB_STORE, { keyPath: "id" });
              store.createIndex("updatedAt", "updatedAt");
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
        return _dbPromise;
      }
      async function idbPut(record) {
        const db = await openDB();
        return new Promise((res, rej) => {
          const tx = db.transaction(DB_STORE, "readwrite");
          tx.objectStore(DB_STORE).put(record);
          tx.oncomplete = () => res();
          tx.onerror = () => rej(tx.error);
        });
      }
      async function idbDelete(id) {
        const db = await openDB();
        return new Promise((res, rej) => {
          const tx = db.transaction(DB_STORE, "readwrite");
          tx.objectStore(DB_STORE).delete(id);
          tx.oncomplete = () => res();
          tx.onerror = () => rej(tx.error);
        });
      }
      async function idbGet(id) {
        const db = await openDB();
        return new Promise((res, rej) => {
          const tx = db.transaction(DB_STORE, "readonly");
          const r = tx.objectStore(DB_STORE).get(id);
          r.onsuccess = () => res(r.result || null);
          r.onerror = () => rej(r.error);
        });
      }
      async function idbGetAll() {
        const db = await openDB();
        return new Promise((res, rej) => {
          const tx = db.transaction(DB_STORE, "readonly");
          const r = tx.objectStore(DB_STORE).getAll();
          r.onsuccess = () => res(r.result || []);
          r.onerror = () => rej(r.error);
        });
      }

      // 현재 화면 상태를 객체로 직렬화
      function buildStateObj() {
        const stateObj = {
          grade: currentGrade,
          studentName: document.getElementById("student-name").value,
          schoolName: document.getElementById("school-name").value,
          examType: document.getElementById("exam-type").value,
          opinion: document.getElementById("opinion-textarea").innerHTML,
          aiOpinionText: lastAiOpinionText,
          selectedKeywords: getSelectedKeywords(),
          customEdits: {},
          activeGrades: {},
          scopeSelections: {},
        };
        document.querySelectorAll(".sub-scope-checkbox").forEach((cb) => {
          stateObj.scopeSelections[cb.getAttribute("data-target")] = cb.checked;
        });
        CURRICULUM_DATA[currentGrade].forEach((unit) => {
          unit.sub.forEach((s) => {
            const contentEl = document.getElementById(`${s.id}-content`);
            const solEl = document.getElementById(`${s.id}-solution`);
            if (contentEl)
              stateObj.customEdits[s.id + "_content"] = contentEl.innerHTML;
            if (solEl) stateObj.customEdits[s.id + "_sol"] = solEl.innerHTML;
            const row = document.getElementById(`${s.id}-row`);
            if (row) {
              if (row.querySelector(".active-a"))
                stateObj.activeGrades[s.id] = "A";
              else if (row.querySelector(".active-b"))
                stateObj.activeGrades[s.id] = "B";
              else if (row.querySelector(".active-c"))
                stateObj.activeGrades[s.id] = "C";
            }
          });
        });
        return stateObj;
      }

      function computeReportId(state) {
        return [
          state.grade,
          (state.studentName || "").trim(),
          (state.schoolName || "").trim(),
          state.examType,
        ].join("|");
      }

      // 이름도 등급도 없는 빈 리포트는 저장하지 않는다(쓰레기 레코드 방지)
      function hasContent(state) {
        return (
          (state.studentName || "").trim() !== "" ||
          Object.keys(state.activeGrades).length > 0
        );
      }

      async function persistCurrentReport() {
        const state = buildStateObj();
        if (!hasContent(state)) return;
        const id = computeReportId(state);
        const record = Object.assign({}, state, { id, updatedAt: Date.now() });
        try {
          if (lastSavedId && lastSavedId !== id) {
            // 이름/학교/시험이 바뀐 경우 → 같은 리포트를 새 식별자로 이동
            await idbDelete(lastSavedId);
          }
          await idbPut(record);
          lastSavedId = id;
        } catch (e) {
          console.warn("자동 저장 실패", e);
        }
      }

      function scheduleSave() {
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
          saveTimer = null;
          persistCurrentReport();
        }, 500);
      }
      async function flushSave() {
        if (saveTimer) {
          clearTimeout(saveTimer);
          saveTimer = null;
        }
        await persistCurrentReport();
      }
      // 기존 코드의 모든 saveCurrentState() 호출 → 자동 저장 예약
      function saveCurrentState() {
        scheduleSave();
      }

      // 저장된 상태 객체를 현재 화면(currentGrade 테이블이 이미 렌더된 상태)에 적용
      function applyStateObj(state) {
        document.getElementById("student-name").value = state.studentName || "";
        document.getElementById("school-name").value = state.schoolName || "";
        if (state.examType)
          document.getElementById("exam-type").value = state.examType;
        document.getElementById("opinion-textarea").innerHTML =
          state.opinion || DEFAULT_OPINION;
        lastAiOpinionText = state.aiOpinionText || "";

        document.querySelectorAll(".opinion-chip").forEach((chip) => {
          const selected = (state.selectedKeywords || []).includes(
            chip.dataset.keyword || chip.textContent.trim(),
          );
          chip.classList.toggle("selected", selected);
          chip.setAttribute("aria-pressed", selected ? "true" : "false");
        });
        restoreScopeSelections(state.scopeSelections || {});

        CURRICULUM_DATA[currentGrade].forEach((unit) => {
          unit.sub.forEach((s) => {
            if (state.customEdits && state.customEdits[s.id + "_content"]) {
              const contentEl = document.getElementById(`${s.id}-content`);
              if (contentEl)
                contentEl.innerHTML = state.customEdits[s.id + "_content"];
            }
            if (state.customEdits && state.customEdits[s.id + "_sol"]) {
              const solEl = document.getElementById(`${s.id}-solution`);
              if (solEl) solEl.innerHTML = state.customEdits[s.id + "_sol"];
            }
            if (state.activeGrades && state.activeGrades[s.id]) {
              const g = state.activeGrades[s.id];
              const row = document.getElementById(`${s.id}-row`);
              if (row) applyGradeState(row, g, { preserveSolution: true });
            }
          });
        });
        updateStatus();
      }

      // 현재 학년+메타에 해당하는 저장본이 있으면 불러온다 (탭 전환 시 사용)
      async function loadCurrentGradeFromDB() {
        const id = computeReportId(buildStateObj());
        try {
          const record = await idbGet(id);
          if (record) {
            applyStateObj(record);
            lastSavedId = record.id;
          } else {
            lastSavedId = null;
          }
        } catch (e) {
          console.warn("불러오기 실패", e);
          lastSavedId = null;
        }
      }

      /* ---------- 저장된 리포트 목록 모달 ---------- */
      function gradeLabelOf(grade) {
        return grade === "mid2" ? "중2" : grade === "mid3" ? "중3" : "중1";
      }
      // 해당 학년 전체 평가 항목 수 (완료율 계산용)
      function gradeTotalOf(grade) {
        const units = CURRICULUM_DATA[grade];
        if (!units) return 0;
        return units.reduce((sum, unit) => sum + unit.sub.length, 0);
      }
      function formatTimestamp(ts) {
        const d = new Date(ts);
        const p = (n) => String(n).padStart(2, "0");
        return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
      }

      function openReportsModal() {
        renderReportsList();
        document.getElementById("reports-modal")?.classList.add("open");
      }
      function closeReportsModal(event) {
        if (event && !event.target.classList.contains("reports-modal")) return;
        document.getElementById("reports-modal")?.classList.remove("open");
      }

      // 모달이 들고 있는 전체 리포트 목록과 현재 필터 상태
      let allReports = [];
      let reportFilter = "all";

      async function renderReportsList() {
        // 검색/필터 초기화
        reportFilter = "all";
        const searchEl = document.getElementById("reports-search");
        if (searchEl) searchEl.value = "";
        document.querySelectorAll("#reports-filter .rf-chip").forEach((c) => {
          c.classList.toggle("active", c.dataset.grade === "all");
        });

        try {
          allReports = await idbGetAll();
        } catch (e) {
          console.warn(e);
          allReports = [];
        }
        allReports.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
        paintReports();
      }

      function setReportFilter(btn, grade) {
        reportFilter = grade;
        document.querySelectorAll("#reports-filter .rf-chip").forEach((c) => {
          c.classList.toggle("active", c === btn);
        });
        paintReports();
      }

      function filterReportsList() {
        paintReports();
      }

      function reportCounts(rep) {
        const counts = rep.activeGrades ? Object.values(rep.activeGrades) : [];
        return {
          a: counts.filter((g) => g === "A").length,
          b: counts.filter((g) => g === "B").length,
          c: counts.filter((g) => g === "C").length,
          total: counts.length,
        };
      }

      function paintReports() {
        const root = document.getElementById("reports-list");
        const toolbar = document.getElementById("reports-toolbar");
        const sub = document.getElementById("reports-modal-sub");
        if (!root) return;
        root.innerHTML = "";

        // 저장본이 하나도 없을 때: 툴바 숨기고 안내 + 새 리포트 카드
        if (!allReports.length) {
          if (toolbar) toolbar.style.display = "none";
          if (sub) sub.textContent = "첫 리포트를 만들어 보세요";
          root.appendChild(buildNewReportCard());
          const empty = document.createElement("div");
          empty.className = "reports-empty";
          empty.innerHTML =
            '<span class="re-emoji">🗂️</span>아직 저장된 리포트가 없습니다.<br />학생 이름을 입력하고 평가를 시작하면 자동으로 저장됩니다.';
          root.appendChild(empty);
          return;
        }

        if (toolbar) toolbar.style.display = "flex";
        if (sub)
          sub.textContent = `저장된 리포트 ${allReports.length}개 · 카드를 누르면 불러옵니다`;

        // 새 리포트 카드는 항상 최상단
        root.appendChild(buildNewReportCard());

        // 검색어 + 학년 필터 적용
        const q = (document.getElementById("reports-search")?.value || "")
          .trim()
          .toLowerCase();
        const filtered = allReports.filter((rep) => {
          if (reportFilter !== "all" && rep.grade !== reportFilter)
            return false;
          if (!q) return true;
          const hay =
            `${rep.studentName || ""} ${rep.schoolName || ""}`.toLowerCase();
          return hay.includes(q);
        });

        if (!filtered.length) {
          const empty = document.createElement("div");
          empty.className = "reports-empty";
          empty.innerHTML =
            '<span class="re-emoji">🔍</span>조건에 맞는 리포트가 없습니다.';
          root.appendChild(empty);
          return;
        }

        filtered.forEach((rep) => root.appendChild(buildReportCard(rep)));
      }

      function buildNewReportCard() {
        const card = document.createElement("div");
        card.className = "report-new-card";
        card.innerHTML =
          '<div class="rnc-plus">＋</div>' +
          '<div><div class="rnc-title">새 리포트 만들기</div>' +
          '<div class="rnc-desc">빈 체크리스트로 새 학생 평가를 시작합니다</div></div>';
        card.addEventListener("click", () => startNewReport());
        return card;
      }

      function buildReportCard(rep) {
        const { a, b, c, total } = reportCounts(rep);
        const all = gradeTotalOf(rep.grade);
        const isCurrent = rep.id === lastSavedId;

        const card = document.createElement("div");
        card.className = "report-card" + (isCurrent ? " current" : "");
        card.addEventListener("click", () => loadReport(rep.id));

        const name = (rep.studentName || "").trim() || "(이름 미입력)";
        const school = (rep.schoolName || "").trim() || "학교 미입력";
        const meta = `${school} · ${rep.examType || "시험 미지정"}`;
        const timeText = rep.updatedAt
          ? "최근 저장 " + formatTimestamp(rep.updatedAt)
          : "";

        // 상단: 학년 배지 · 이름/메타 · 삭제
        const top = document.createElement("div");
        top.className = "rc-top";
        top.innerHTML =
          `<span class="rc-grade rc-grade-${rep.grade}">${gradeLabelOf(rep.grade)}</span>` +
          `<div class="rc-id"><div class="rc-name">${escapeHtml(name)}` +
          (isCurrent ? '<span class="rc-current-tag">현재 열림</span>' : "") +
          `</div><div class="rc-meta">${escapeHtml(meta)}</div></div>`;
        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "rc-del";
        delBtn.title = "삭제";
        delBtn.textContent = "🗑";
        delBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          deleteReport(rep.id, rep);
        });
        top.appendChild(delBtn);
        card.appendChild(top);

        // 분포 막대
        const bar = document.createElement("div");
        bar.className = "rc-bar";
        if (total === 0) {
          bar.innerHTML = '<div class="rc-bar-empty">아직 평가 전</div>';
        } else {
          const w = (n) => ((n / total) * 100).toFixed(1) + "%";
          bar.innerHTML =
            (a ? `<span class="seg seg-a" style="width:${w(a)}"></span>` : "") +
            (b ? `<span class="seg seg-b" style="width:${w(b)}"></span>` : "") +
            (c ? `<span class="seg seg-c" style="width:${w(c)}"></span>` : "");
        }
        card.appendChild(bar);

        // 하단: 범례 + 진행도
        const foot = document.createElement("div");
        foot.className = "rc-foot";
        foot.innerHTML =
          '<div class="rc-legend">' +
          `<span class="lg lg-a">우수 ${a}</span>` +
          `<span class="lg lg-b">보통 ${b}</span>` +
          `<span class="lg lg-c">미흡 ${c}</span>` +
          "</div>" +
          `<div class="rc-progress">평가 ${total}${all ? " / " + all : ""}${timeText ? " · " + timeText : ""}</div>`;
        card.appendChild(foot);

        return card;
      }

      async function loadReport(id) {
        await flushSave(); // 현재 작업 중인 내용 보존
        let record = null;
        try {
          record = await idbGet(id);
        } catch (e) {
          console.warn(e);
        }
        if (!record) {
          alert("리포트를 찾을 수 없습니다.");
          renderReportsList();
          return;
        }
        currentGrade = record.grade;
        document
          .querySelectorAll(".tab-btn")
          .forEach((b) => b.classList.remove("active"));
        document.getElementById("tab-" + currentGrade)?.classList.add("active");
        renderScopeWidget();
        renderReportTables();
        applyStateObj(record);
        lastSavedId = record.id;
        updateTitle();
        hideMacroPopover();
        updateStatus();
        closeReportsModal();
      }

      async function deleteReport(id, rep) {
        const label = rep && rep.studentName ? rep.studentName : "이 리포트";
        if (!confirm(`'${label}' 리포트를 삭제할까요? 되돌릴 수 없습니다.`))
          return;
        try {
          await idbDelete(id);
        } catch (e) {
          console.warn(e);
        }
        if (id === lastSavedId) lastSavedId = null;
        // 검색/필터 상태는 유지한 채 목록만 갱신
        allReports = allReports.filter((r) => r.id !== id);
        paintReports();
      }

      // 새 빈 리포트 시작 (저장본은 그대로 유지)
      async function startNewReport() {
        await flushSave();
        lastSavedId = null;
        document.getElementById("student-name").value = "";
        document.getElementById("school-name").value = "";
        document.getElementById("exam-type").selectedIndex = 0;
        document.getElementById("opinion-textarea").innerHTML = DEFAULT_OPINION;
        document.querySelectorAll(".opinion-chip").forEach((chip) => {
          chip.classList.remove("selected");
          chip.setAttribute("aria-pressed", "false");
        });
        renderScopeWidget();
        renderReportTables();
        updateTitle();
        hideMacroPopover();
        updateStatus();
        closeReportsModal();
      }

      function setPrintDate() {
        const el = document.getElementById("print-date");
        if (!el) return;
        const now = new Date();
        el.textContent = `발급일 ${now.getFullYear()}. ${String(
          now.getMonth() + 1,
        ).padStart(2, "0")}. ${String(now.getDate()).padStart(2, "0")}`;
      }

      window.onload = async function () {
        // 기본 종합의견 문구 보관 (새 리포트 시작 시 복원용)
        DEFAULT_OPINION = document.getElementById("opinion-textarea").innerHTML;
        setPrintDate();

        currentGrade = "mid1";
        renderScopeWidget();
        renderReportTables();
        updateTitle();
        updateStatus();

        // 페이지를 열면 초기화 대신, 저장된 리포트가 있으면 목록을 먼저 보여준다.
        try {
          const reports = await idbGetAll();
          if (reports.length) openReportsModal();
        } catch (e) {
          console.warn("저장된 리포트 조회 실패", e);
        }
      };
    </script>
  </body>
</html>
