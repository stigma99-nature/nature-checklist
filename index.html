<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>네이처과학학원 완벽내신 CHECKLIST</title>

    <!--
      ==========================================================================
      index.html — 선생님용 체크리스트 화면 뼈대 (HTML)
      --------------------------------------------------------------------------
      이 파일에는 "화면에 무엇이 있는지"만 적혀 있습니다.
        · 모양 (색 · 크기 · 배치)  → css/ 폴더
        · 동작 (클릭 · 저장 등)    → js/ 폴더
        · 저장소 (명단 · 저장)     → js/db/ 폴더 (Firebase 연결 정보: js/firebase-config.js)
        · 전체 구조 안내           → README.md
      학생 명단 관리는 관리자 페이지(/admin → admin/index.html)에서 합니다.

      onclick="함수이름()" 처럼 적힌 함수는 js/ 폴더의 파일에 있습니다.
      각 영역 위 주석에 어느 파일을 보면 되는지 적어 두었습니다.
      ==========================================================================
    -->

    <!-- 글꼴: Pretendard (인터넷에서 불러옴) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />

    <!--
      스타일(CSS) — ⚠️ 순서가 중요합니다!
      같은 대상에 같은 우선순위의 스타일이 겹치면 "아래에 있는 파일"이 이깁니다.
        base.css             색상 변수 · 기본 스타일 · 전체 2단 레이아웃
        login.css            ⓪ 로그인 화면
        sidebar.css          ① 왼쪽: 선생님 · 시험 선택 · 담당 학생 목록 · 단원 설정 · ⑥ 시험 선택 안내
        report-header.css    ② 가운데: A4 용지 · 머리말 (이름/학교/시험)
        checklist-table.css  ② 가운데: 체크리스트 표 · ⑤ SOLUTION 문구 팝오버
        opinion.css          ② 가운데 아래: 종합 의견
        action-dock.css      ③ 오른쪽 위 버튼 모음 · 저장 상태 · ④ 토스트
        responsive.css       화면 폭별 배치 (넓은 PC: 단원 설정을 오른쪽에 / 모바일: 한 줄 배치)
        print.css            인쇄용 덮어쓰기 (반드시 맨 마지막)
    -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/login.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/report-header.css" />
    <link rel="stylesheet" href="css/checklist-table.css" />
    <link rel="stylesheet" href="css/opinion.css" />
    <link rel="stylesheet" href="css/action-dock.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/print.css" />

    <!-- html2canvas-pro: 기존 html2canvas의 드롭인 대체. color-mix()/color() 등
         최신 CSS 색상 함수를 지원해 이미지 저장 실패를 막는다. 전역명은 동일(html2canvas). -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas-pro@1.5.8/dist/html2canvas-pro.min.js"></script>
  </head>
  <body>
    <!--
      화면 구성
        ⓪ 로그인 화면 ··········· 선생님 이름 입력 (로그인 전에는 화면 전체를 덮음)
        ① 왼쪽 사이드바 ········· 선생님 · 시험 선택 · 담당 학생 목록 · 학생 추가·수정 · 단원 설정
                                  (단원 설정은 넓은 PC 화면에서 오른쪽에 보임 → css/responsive.css)
        ② 가운데 A4 리포트 ······ 머리말, 체크리스트 표 (JS 가 생성), 종합 의견, 인쇄용 푸터
        ③ 오른쪽 위 버튼 모음 ··· 인쇄 / 이미지 저장 / 이미지 복사
        ④ 토스트 알림
        ⑤ SOLUTION 문구 팝오버
        ⑥ 시험 선택 안내 ········ 시험이 공란이면 시험 선택 칸만 밝게, 나머지는 어둡게
      class="no-print" 가 붙은 요소는 인쇄물과 이미지에 나오지 않습니다.
    -->

    <!-- ⓪ 로그인 화면 ─ css/login.css · js/login.js
         이름을 입력하면 관리자가 등록한 명단에서 그 선생님의 담당 학생을 찾습니다. -->
    <div class="login-screen no-print" id="login-screen">
      <form class="login-card" onsubmit="submitLogin(event)">
        <div class="login-logo">nature science</div>
        <h1 class="login-title">완벽내신 CHECKLIST</h1>
        <label class="login-label" for="login-name">선생님 이름</label>
        <input
          type="text"
          id="login-name"
          class="login-input"
          placeholder="이름을 입력하세요"
          maxlength="30"
          autocomplete="name"
        />
        <button type="submit" class="login-submit" id="login-submit">
          시작하기
        </button>
        <p class="login-message" id="login-message" role="alert"></p>
      </form>
    </div>

    <div class="app-shell">
      <!-- ① 왼쪽 사이드바 ─ css/sidebar.css -->
      <aside class="sidebar no-print">
        <!-- 선생님 패널: 이름 · 로그아웃(js/login.js) · 시험 선택(js/student-list.js)
             시험 종류 목록은 여기 <option> 만 고치면 머리말에도 똑같이 반영됩니다.
             첫 번째 빈 항목(value="")이 기본 선택입니다 — 머리말에는 공란으로 보입니다.
             ⚠️ option 의 value 는 저장된 체크리스트와 연결되므로 이미 쓰던 값은 바꾸지 마세요. -->
        <div class="teacher-panel">
          <div class="teacher-row">
            <span class="teacher-name" id="teacher-name"></span>
            <button type="button" class="btn-logout" onclick="logout()">
              로그아웃
            </button>
          </div>
          <label class="exam-picker">
            <span>시험</span>
            <select
              id="exam-select"
              class="exam-select"
              onchange="onExamSelectChange()"
            >
              <option value="">시험 선택</option>
              <option value="1학기 중간고사">1학기 중간 대비</option>
              <option value="1학기 기말고사">1학기 기말 대비</option>
              <option value="2학기 중간고사">2학기 중간 대비</option>
              <option value="2학기 기말고사">2학기 기말 대비</option>
            </select>
          </label>
          <!-- 빈 체크리스트(명단에 없는 이름으로 로그인)일 때만 보이는 학년 선택
               → onBlankGradeChange() : js/student-list.js (선택지는 initExamSelect 가 채움) -->
          <label class="exam-picker" id="blank-grade-picker" hidden>
            <span>학년</span>
            <select
              id="blank-grade-select"
              class="exam-select"
              onchange="onBlankGradeChange()"
            ></select>
          </label>
        </div>

        <!-- 담당 학생 목록: 로그인하면 renderStudentList() (js/student-list.js) 가 반별로 묶어 채움
             목록 아래 버튼: "학생 추가" → 새 학생 입력 폼 / "이름·학교 수정" → 지금 열린 학생 정보 수정 폼 -->
        <div class="student-panel">
          <div class="panel-title">
            담당 학생 <span id="student-count">0</span>명
          </div>
          <div class="student-list" id="student-list"></div>

          <!-- 학생 추가 · 이름·학교 수정 ─ js/student-list.js · css/sidebar.css
               · 학생 추가 → openAddStudentForm() : 명단에 없는 학생을 로그인한 선생님 명단에 바로 등록
               · 이름·학교 수정 → openEditStudentForm() : 지금 체크리스트가 열린 학생의 이름 · 학교명 고치기
                 (열린 학생이 없으면 버튼이 잠김. 학년 · 반 변경과 삭제는 관리자 페이지 /admin 에서)
               두 버튼이 아래 폼 하나를 함께 씁니다 (수정할 때는 학년 칸이 숨음).
               저장 → submitStudentForm() / 취소 → closeStudentForm()  (학년 선택지는 initExamSelect 가 채움) -->
          <div class="student-actions" id="student-actions">
            <button
              type="button"
              class="btn-student-action"
              onclick="openAddStudentForm()"
            >
              ＋ 학생 추가
            </button>
            <button
              type="button"
              class="btn-student-action"
              id="edit-student-open"
              onclick="openEditStudentForm()"
              disabled
            >
              ✏️ 이름·학교 수정
            </button>
          </div>
          <form
            class="student-form"
            id="student-form"
            onsubmit="submitStudentForm(event)"
            oninput="setStudentFormMessage('')"
            hidden
          >
            <div class="sf-title" id="student-form-title">새 학생 추가</div>
            <label class="sf-field">
              <span>이름</span>
              <input
                type="text"
                id="student-form-name"
                maxlength="30"
                placeholder="예) 홍길동"
                autocomplete="off"
              />
            </label>
            <label class="sf-field">
              <span>학교명</span>
              <input
                type="text"
                id="student-form-school"
                maxlength="40"
                placeholder="예) 예시중"
                autocomplete="off"
              />
            </label>
            <label class="sf-field" id="student-form-grade-field">
              <span>학년</span>
              <select id="student-form-grade"></select>
            </label>
            <p class="sf-message" id="student-form-message" role="alert"></p>
            <div class="sf-actions">
              <button
                type="button"
                class="sf-cancel"
                onclick="closeStudentForm()"
              >
                취소
              </button>
              <button type="submit" class="sf-submit" id="student-form-submit">
                추가
              </button>
            </div>
          </form>
        </div>

        <!-- 단원 설정 패널: 체크한 단원만 리포트에 표시 ─ js/scope-panel.js
             넓은 PC 화면(폭 1280px 이상)에서는 css/responsive.css 가 화면 오른쪽에 고정해서 보여 줌 -->
        <div class="scope-selector-panel">
          <div class="selector-title">
            <span>단원 설정</span>
            <span class="status-pill" id="scope-status">전체 단원 표시 중</span>
          </div>
          <!-- 전체 켜기 / 끄기 → setAllScopes() -->
          <div class="master-control-row">
            <button
              type="button"
              class="btn-master btn-master-all"
              onclick="setAllScopes(true)"
            >
              ✓ 전체 단원 켜기
            </button>
            <button
              type="button"
              class="btn-master btn-master-clear"
              onclick="setAllScopes(false)"
            >
              ✕ 전체 단원 끄기
            </button>
          </div>
          <!-- 진단평가 방식 한꺼번에 바꾸기 → setAllDetail() : js/checklist-table.js
               간단히 = 대단원마다 진단평가 · SOLUTION 1개 (기본) / 자세히 = 중단원 줄마다
               대단원 하나만 바꾸려면 표 제목 오른쪽의 "진단평가 자세히" 스위치를 누르면 됩니다.
               지금 상태와 같은 버튼은 updateDetailControls() 가 강조(.is-active)합니다. -->
          <div class="detail-control-row">
            <span class="detail-control-label">진단평가</span>
            <div class="detail-control-buttons">
              <button
                type="button"
                class="btn-detail"
                id="detail-all-on"
                onclick="setAllDetail(true)"
              >
                모두 자세히
              </button>
              <button
                type="button"
                class="btn-detail"
                id="detail-all-off"
                onclick="setAllDetail(false)"
              >
                모두 간단히
              </button>
            </div>
          </div>
          <!-- 대단원 · 중단원 체크박스 목록: renderScopeWidget() 가 채움 -->
          <div class="scope-group-container" id="scope-widget-root"></div>
        </div>
      </aside>

      <!-- ② 가운데 A4 리포트 용지 ─ css/report-header.css
           id="capture-target-paper" 안쪽이 이미지 저장/복사 때 찍히는 영역입니다. -->
      <main class="report-workspace">
        <div class="report-paper" id="capture-target-paper">
          <!-- 머리말: 로고 문구 · 제목 · 학생 정보 → js/report-header.js -->
          <div class="header-section">
            <div>
              <div class="logo-area">nature science</div>
              <h1 class="main-title">완벽내신 CHECKLIST</h1>
            </div>
            <!-- 학생 정보 3칸
                 · 목록에서 고른 학생: 명단 정보로 자동으로 채워짐 (읽기 전용)
                 · 빈 체크리스트: 이름 · 학교명을 직접 입력 → onHeaderInput() : js/report-header.js
                 시험 칸의 선택지는 왼쪽 시험 선택에서 복사됨 (js/student-list.js 의 initExamSelect) -->
            <div class="student-meta-grid">
              <div class="meta-cell">
                <label>이름 :</label
                ><input
                  type="text"
                  id="student-name"
                  class="meta-input"
                  value=""
                  placeholder="학생 이름"
                  maxlength="30"
                  readonly
                  tabindex="-1"
                  oninput="onHeaderInput()"
                />
              </div>
              <div class="meta-cell">
                <label>학교명 :</label
                ><input
                  type="text"
                  id="school-name"
                  class="meta-input"
                  value=""
                  placeholder="학교명"
                  maxlength="40"
                  readonly
                  tabindex="-1"
                  oninput="onHeaderInput()"
                />
              </div>
              <div class="meta-cell">
                <label>시험 :</label>
                <select
                  id="exam-type"
                  class="meta-select is-readonly"
                  tabindex="-1"
                  aria-readonly="true"
                ></select>
              </div>
            </div>
          </div>

          <!-- 단원별 체크리스트 표: renderReportTables() (js/checklist-table.js) 가 채움
               대단원마다 제목 오른쪽 "진단평가 자세히" 스위치(화면에서만 보임)로
               진단평가를 대단원별 1개(기본) ↔ 중단원별로 바꿈
               학생을 고르기 전이나 불러오는 중에는 안내 문구가 대신 보임 -->
          <div id="report-table-root"></div>

          <!-- 종합 의견 ─ css/opinion.css
               클릭해서 직접 입력 (입력하면 자동 저장 → js/storage.js)
               안쪽 주석은 예전 예시 문장입니다. 이 칸의 처음 내용이 새 체크리스트의 기본값이 됩니다. -->
          <div class="opinion-section">
            <div
              id="opinion-textarea"
              class="opinion-box"
              contenteditable="true"
              oninput="saveCurrentState()"
            >
              <!-- 현재 전반적인 개념 이해도는 양호하나 특정 응용 문제 풀이 및 고난도
              심화 유형에 대한 훈련이 다소 부족한 상태입니다. 학교별 출제 경향을
              고려할 때, 틀린 문제와 연계된 심화 이론을 완벽히 정립하고 시험장에
              들어가야 실수를 줄일 수 있습니다. 따라서 다가오는 직전 보강
              시험에는 반드시 필참할 수 있도록 지도해주시고, 추가로 배부된
              고난도 시크릿 모의고사 문항을 마저 모두 풀어 제출할 수 있도록
              가정에서도 함께 점검 및 격려 부탁드립니다. -->
            </div>
          </div>

          <!-- 인쇄할 때만 보이는 푸터 (발급일은 setPrintDate() 가 오늘 날짜로 채움) -->
          <div class="print-footer">
            <span class="pf-brand">nature science · 완벽내신 CHECKLIST</span>
            <span class="pf-date" id="print-date"></span>
          </div>
        </div>
      </main>
    </div>

    <!-- ③ 오른쪽 위 버튼 모음 (모바일에서는 화면 맨 아래) ─ css/action-dock.css
         🖨️ 인쇄 · 📸 이미지 저장 · 📋 이미지 복사 → js/export.js
         진행 현황 (#report-status) → updateStatus() : js/checklist-table.js
         자동 저장 상태 (#save-state) → setSaveState() : js/notify.js -->
    <div class="action-dock no-print">
      <div class="action-dock-buttons">
        <button type="button" class="btn-action-print" onclick="printReport()">
          🖨️ 인쇄 / PDF
        </button>
        <button
          type="button"
          class="btn-action-image"
          onclick="saveAsImageFile()"
        >
          📸 이미지 저장
        </button>
        <button
          type="button"
          class="btn-action-copy"
          onclick="copyImageToClipboard()"
        >
          📋 이미지 복사
        </button>
      </div>
      <div class="action-dock-status" id="report-status">평가 0개 완료</div>
      <div class="action-dock-save is-idle" id="save-state">
        입력하면 자동 저장됩니다
      </div>
    </div>

    <!-- ④ 토스트 알림: showToast() (js/notify.js) 가 글자를 넣고 잠깐 보여 줌 -->
    <div
      class="app-toast no-print"
      id="app-toast"
      role="status"
      aria-live="polite"
    ></div>

    <!-- ⑥ 시험 선택 안내 ─ css/sidebar.css · js/student-list.js 의 updateExamSpotlight
         로그인했는데 시험이 공란이면 왼쪽 위 시험 선택 칸만 밝게 두고 나머지 화면을 어둡게 함.
         시험을 고르면 사라짐. 말풍선 문구는 아래 <b> · <span> 에서 고치세요. -->
    <div
      class="exam-spotlight no-print"
      id="exam-spotlight"
      aria-hidden="true"
      hidden
    ></div>
    <div class="exam-spotlight-tip no-print" id="exam-spotlight-tip" hidden>
      <b>먼저 시험을 선택해 주세요</b>
      <span>시험을 고르면 학생의 체크리스트가 열려요.</span>
    </div>

    <!-- ⑤ SOLUTION 문구 팝오버 ─ css/checklist-table.css · js/checklist-table.js

    <!--
      동작(JS) — ⚠️ 순서가 중요합니다! 위에서부터 차례대로 불러와 실행합니다.
      모듈이 아닌 일반 <script> 라서 모든 파일이 같은 전역 공간을 공유합니다.
      (한 파일에서 만든 함수 · 변수를 다른 파일에서 그대로 부를 수 있음)

      [데이터]
        data/curriculum.js      학년별 단원 · 주요 내용
      [기본]
        config.js               고정 설정값 (학년 이름표, 단원 색, A/B/C 표시, 저장 간격)
        state.js                여러 파일이 함께 쓰는 현재 상태 변수
        utils.js                글자 다루기 · HTML 정리 · 브라우저 저장소 도우미
      [저장소] — 명단 · 체크리스트를 Firebase 에 읽고 쓰기
        firebase-config.js      🔑 Firebase 연결 정보 (배포 전에 한 번 채우기)
        db/firebase-db.js       Firebase(Firestore) 저장소
        db/test-db.js           테스트 모드 저장소 (설정이 비어 있을 때, 이 브라우저에만 저장)
        db/db.js                둘 중 하나를 골라 DB 로 사용 + 입력값 검사 (반드시 위 두 파일 다음)
      [저장 · 알림]
        notify.js               자동 저장 상태 표시 · 토스트 알림
        storage.js              체크리스트 자동 저장 / 불러오기
        legacy-import.js        예전 버전(브라우저 저장본) 가져오기
      [화면 기능]
        scope-panel.js          ① 단원 설정 체크박스
        report-header.js        ② 머리말 (명단 정보 / 빈 체크리스트는 직접 입력) · 저장 파일 이름
        checklist-table.js      ② 체크리스트 표 · 진단평가 간단히/자세히 · A/B/C 평가 · 진단평가 메모 · ⑤ SOLUTION 문구 팝오버
        student-list.js         ① 시험 선택 · 반별 담당 학생 목록 · 학생 추가·수정 · 체크리스트 열기 · 빈 체크리스트
        login.js                ⓪ 선생님 로그인 / 로그아웃 (명단에 없는 이름 → 빈 체크리스트)
        export.js               ③ 출력 전 검사 · 인쇄/PDF · 이미지 저장/복사
      [시작]
        main.js                 페이지를 열면 실행 (반드시 마지막)
    -->
